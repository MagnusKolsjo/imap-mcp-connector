  const show = !!ext && (ext.loaded || ext.has_remote_content);
  box.hidden = !show;
  if (!show) return;
  const sender = ext.sender || "", domain = ext.domain || "";
  // On the list, but the mail server could not confirm the message really
  // comes from there: nothing loads by itself, the reader decides.
  const listed = !!(ext.listed_via || ext.trusted);
  const unverified = listed && !ext.trusted;
  const via = (ext.trusted_via || ext.listed_via) === "domain" ? "domain" : "sender";
  $("ext-load").hidden = !!ext.loaded;
  $("ext-sender").hidden = listed || !sender;
  $("ext-domain").hidden = listed || !domain;
  $("ext-sender").textContent = t("mailbox.ext_always_sender", {sender});
  $("ext-domain").textContent = t("mailbox.ext_always_domain", {domain});
  $("ext-untrust").hidden = !listed;
  $("ext-untrust").textContent = t(`mailbox.ext_untrust_${via}`, {sender, domain});
  $("ext-note").textContent = ext.trusted ? t(`mailbox.ext_trusted_${via}`, {sender, domain})
    : unverified ? t(`mailbox.ext_unverified_${via}`, {sender, domain})
    : ext.loaded ? t("mailbox.ext_loaded_once")
    : ext.images_left_out ? t("mailbox.ext_blocked_images") : t("mailbox.ext_blocked");
}

async function reopenWithExternal(loadExternal) {
  const m = S.open;
  if (!m) return false;
  setStatus(t("mailbox.ext_loading"));
  try {
    const data = await callTool("imap_panel_open", {account: S.account, folder: m.folder, uid: m.uid,
                                                     uidvalidity: m.uidvalidity, load_external: loadExternal});
    if (!S.open || S.open.uid !== m.uid) return false;
    S.open = data;
    renderMessage();
    // The button that was pressed is usually hidden now; keep focus nearby.
    $("ext-note").focus();
    setStatus(t("mailbox.ext_done"));
    return true;
  } catch (err) {
    setStatus(t("mailbox.error_open", {detail: err.message}), true);
    return false;
  }
}

async function changeTrust(kind, remove) {
  const ext = (S.open && S.open.external) || {};
  const value = kind === "sender" ? ext.sender : ext.domain;
  if (!value) return;
  try {
    // Adding is confirmed in a system dialog where there is one; declining
    // there changes nothing and needs no message here. Without such a
    // dialog the server adds nothing: the settings page in the browser has
    // a form for it, and is opened when the server runs on this computer.
    const result = await callTool("imap_panel_trust", {account: S.account, kind, value, remove: !!remove, lang: S.lang});
    if (result.cancelled) return;
    if (result.needs_browser) {
      let opened = false;
      if (result.can_open_browser) {
        try { await callTool("imap_panel_open_browser_settings", {}); opened = true; } catch (err) { /* told below */ }
      }
      setStatus(t(opened ? "mailbox.ext_trust_browser" : "mailbox.ext_trust_browser_manual", {value}));
      return;
    }
  } catch (err) {
    setStatus(t("mailbox.ext_trust_failed", {detail: err.message}), true);
    return;
  }
  if (await reopenWithExternal(false)) {
    setStatus(t(remove ? "mailbox.ext_untrusted_done" : "mailbox.ext_trusted_done", {value}));
  }
}

$("ext-load").addEventListener("click", () => reopenWithExternal(true));
$("ext-sender").addEventListener("click", () => changeTrust("sender", false));
$("ext-domain").addEventListener("click", () => changeTrust("domain", false));
$("ext-untrust").addEventListener("click", () => {
  const ext = (S.open && S.open.external) || {};
  changeTrust((ext.trusted_via || ext.listed_via) === "domain" ? "domain" : "sender", true);
});

// The sandbox blocks navigation; a link in a message opens via the host,
// which shows the address. The link's own address is used, never its text.
$("msg-body").addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[href]");
  if (!a) return;
  e.preventDefault();
  const url = a.getAttribute("href") || "";
  if (SAFE_LINK.test(url)) request("ui/open-link", {url}).catch(() => setStatus(t("mailbox.link_failed", {url}), true));
});

const editorAvailable = () => typeof window.Squire === "function" && !!window.DOMPurify && typeof window.DOMPurify.sanitize === "function";
const isHtmlCompose = () => !!(S.compose && S.compose.html);
// The element whose scrolling counts as reading the text before sending.
const bodyElement = () => isHtmlCompose() ? $("c-editor") : $("c-body");

function sanitizedFragment(html, config) {
  const frag = DOMPurify.sanitize(String(html || ""), {...config, RETURN_DOM_FRAGMENT: true});
  return frag ? document.importNode(frag, true) : document.createDocumentFragment();
}

let squire = null;
function editor() {
  if (squire) return squire;
  squire = new Squire($("c-editor"), {
    blockTag: "DIV",
    sanitizeToDOMFragment: html => sanitizedFragment(html, PURIFY_EDITOR),
  });
  for (const type of ["pathChange", "select", "cursor", "input"]) squire.addEventListener(type, updateToolbar);
  squire.setKeyHandler(IS_MAC ? "Meta-k" : "Ctrl-k", (self, event) => { event.preventDefault(); openLinkDialog(); });
  return squire;
}

// Toolbar buttons that show a state, and the elements that mean it.
const FORMAT_TAGS = {bold: ["B", "STRONG"], italic: ["I", "EM"], underline: ["U"], ul: ["UL"], ol: ["OL"],
                     quote: ["BLOCKQUOTE"]};
const hasAny = (ed, tags) => tags.some(tag => ed.hasFormat(tag));

const EDITOR_COMMANDS = {
  bold: ed => hasAny(ed, FORMAT_TAGS.bold) ? ed.removeBold() : ed.bold(),
  italic: ed => hasAny(ed, FORMAT_TAGS.italic) ? ed.removeItalic() : ed.italic(),
  underline: ed => ed.hasFormat("U") ? ed.removeUnderline() : ed.underline(),
  ul: ed => ed.hasFormat("UL") ? ed.removeList() : ed.makeUnorderedList(),
  ol: ed => ed.hasFormat("OL") ? ed.removeList() : ed.makeOrderedList(),
  quote: ed => ed.hasFormat("BLOCKQUOTE") ? ed.removeQuote() : ed.increaseQuoteLevel(),
  clear: ed => ed.removeAllFormatting(),
  link: () => openLinkDialog(),
  unlink: ed => {
    const range = ed.getSelection();
    const a = closestLink(range);
    if (!a && !ed.hasFormat("A")) return;
    if (a && range.collapsed) { range.selectNode(a); ed.setSelection(range); }
    ed.removeLink();
    setStatus(t("mailbox.link_removed"));
  },
};

// Button names (also the tooltip text), with the keyboard shortcut where
// there is one: Cmd on Apple devices, Ctrl elsewhere, as Squire does.
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || "");
const TOOLBAR_NAMES = {bold: ["mailbox.fmt_bold", "B"], italic: ["mailbox.fmt_italic", "I"],
  underline: ["mailbox.fmt_underline", "U"], ul: ["mailbox.fmt_ul"], ol: ["mailbox.fmt_ol"],
  quote: ["mailbox.fmt_quote"], link: ["mailbox.fmt_link", "K"], unlink: ["mailbox.link_remove"],
  clear: ["mailbox.fmt_clear"]};

function renderToolbarNames() {
  $("c-toolbar").setAttribute("aria-label", t("mailbox.editor_toolbar"));
  for (const button of toolbarButtons()) {
    const [key, letter] = TOOLBAR_NAMES[button.dataset.cmd];
    const name = letter ? t("mailbox.fmt_with_shortcut", {name: t(key), keys: `${IS_MAC ? "Cmd" : "Ctrl"}+${letter}`}) : t(key);
    button.setAttribute("aria-label", name);
  }
  if (tipButton) $("c-tip").textContent = tipButton.getAttribute("aria-label");
}

const toolbarButtons = () => [...$("c-toolbar").querySelectorAll("button[data-cmd]")];

function updateToolbar() {
  if (!isHtmlCompose() || !squire) return;
  for (const button of toolbarButtons()) {
    const tags = FORMAT_TAGS[button.dataset.cmd];
    if (tags) button.setAttribute("aria-pressed", hasAny(squire, tags) ? "true" : "false");
  }
  // Removing a link only does something with the caret in one.
  const unlink = $("c-toolbar").querySelector('[data-cmd="unlink"]');
  if (squire.hasFormat("A")) unlink.removeAttribute("aria-disabled"); else unlink.setAttribute("aria-disabled", "true");
}

// ---- Tooltips (WCAG 1.4.13: dismissible, hoverable, persistent) ----
// The text repeats the button's accessible name, so the tooltip is
// aria-hidden and not linked with aria-describedby.
let tipButton = null;
let tipShowTimer = 0;
let tipHideTimer = 0;
let tipHovered = false;

function showTip(button) {
  clearTimeout(tipShowTimer);
  clearTimeout(tipHideTimer);
  const tip = $("c-tip");
  tipButton = button;
  tip.textContent = button.getAttribute("aria-label") || "";
  tip.hidden = false;
  const b = button.getBoundingClientRect();
  const w = $("c-toolbar-wrap").getBoundingClientRect();
  tip.style.left = `${Math.max(0, Math.min(b.left - w.left + (b.width - tip.offsetWidth) / 2, w.width - tip.offsetWidth))}px`;
  tip.style.top = `${b.bottom - w.top + 2}px`;
}

function hideTip() {
  clearTimeout(tipShowTimer);
  clearTimeout(tipHideTimer);
  $("c-tip").hidden = true;
  tipButton = null;
  tipHovered = false;
}

// Hides once the pointer has left both the button and the tooltip, unless
// the button has keyboard focus.
function hideTipSoon() {
  clearTimeout(tipShowTimer);
  clearTimeout(tipHideTimer);
  tipHideTimer = setTimeout(() => {
    if (tipHovered) return;
    if (tipButton && document.activeElement === tipButton && tipButton.matches(":focus-visible")) return;
    hideTip();
  }, 200);
}

$("c-toolbar").addEventListener("mouseover", e => {
  const button = e.target.closest("button[data-cmd]");
  if (!button) return;
  if (button === tipButton) { clearTimeout(tipHideTimer); return; }
  clearTimeout(tipShowTimer);
  // Moving along the toolbar while a tooltip shows: no new delay.
  tipShowTimer = setTimeout(() => showTip(button), $("c-tip").hidden ? 300 : 0);
});
$("c-toolbar").addEventListener("mouseout", e => {
  const from = e.target.closest("button[data-cmd]");
  const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest("button[data-cmd]") : null;
  if (from && from === to) return;
  hideTipSoon();
});
$("c-toolbar").addEventListener("focusin", e => {
  const button = e.target.closest("button[data-cmd]");
  if (button && button.matches(":focus-visible")) showTip(button);
});
$("c-toolbar").addEventListener("focusout", () => { if (!tipHovered) hideTip(); });
$("c-tip").addEventListener("mouseenter", () => { tipHovered = true; clearTimeout(tipHideTimer); });
$("c-tip").addEventListener("mouseleave", () => { tipHovered = false; hideTipSoon(); });
// Escape hides the tooltip and does nothing else; focus stays put.
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("c-tip").hidden) { e.stopPropagation(); e.preventDefault(); hideTip(); }
}, true);

// Roving tabindex: the toolbar is one Tab stop, the arrow keys move within.
function rovingFocus(button) {
  for (const b of toolbarButtons()) b.tabIndex = b === button ? 0 : -1;
  button.focus();
}

$("c-toolbar").addEventListener("keydown", e => {
  const buttons = toolbarButtons();
  const i = buttons.indexOf(document.activeElement);
  if (i < 0) return;
  const next = {ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: buttons.length - 1}[e.key];
  if (next === undefined) return;
  e.preventDefault();
  rovingFocus(buttons[(next + buttons.length) % buttons.length]);
});
// Mouse clicks leave the caret and the selection in the text.
$("c-toolbar").addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); });
$("c-toolbar").addEventListener("click", e => {
  const button = e.target.closest("button[data-cmd]");
  if (!button || !isHtmlCompose()) return;
  for (const b of toolbarButtons()) b.tabIndex = b === button ? 0 : -1;
  EDITOR_COMMANDS[button.dataset.cmd](editor());
  updateToolbar();
});
// The label names the editor; clicking it moves there, as for a text field.
$("c-body-label").addEventListener("click", () => { if (isHtmlCompose()) editor().focus(); });

// ---- Link dialog ----
let linkRange = null;
let linkAnchor = null;

function closestLink(range) {
  let node = range && range.startContainer;
  if (node && node.nodeType !== Node.ELEMENT_NODE) node = node.parentNode;
  const a = node && node.closest ? node.closest("a") : null;
  return a && $("c-editor").contains(a) ? a : null;
}

function setLinkError(text) {
  $("link-url-error").textContent = text;
  $("link-url-error").hidden = !text;
  $("link-url").closest(".cfield").classList.toggle("invalid", !!text);
  if (text) {
    $("link-url").setAttribute("aria-invalid", "true");
    $("link-url").setAttribute("aria-describedby", "link-url-error link-url-hint");
  } else {
    $("link-url").removeAttribute("aria-invalid");
    $("link-url").setAttribute("aria-describedby", "link-url-hint");
  }
}

function openLinkDialog() {
  const range = editor().getSelection();
  linkRange = range ? range.cloneRange() : null;
  linkAnchor = closestLink(linkRange);
  $("link-title").textContent = t(linkAnchor ? "mailbox.link_title_edit" : "mailbox.link_title_add");
  $("link-url").value = linkAnchor ? (linkAnchor.getAttribute("href") || "") : "";
  $("link-remove").hidden = !linkAnchor;
  setLinkError("");
  $("link-dialog").showModal();
  $("link-url").focus();
}

// The range the link applies to: the selection, or the whole link the
// caret is in.
function linkTarget() {
  const range = linkRange ? linkRange.cloneRange() : null;
  if (range && linkAnchor && range.collapsed) range.selectNode(linkAnchor);
  return range;
}

$("link-form").addEventListener("submit", e => {
  e.preventDefault();
  const url = $("link-url").value.trim();
  if (!SAFE_LINK.test(url)) {
    setLinkError(t("mailbox.link_error"));
    $("link-url").focus();
    return;
  }
  const range = linkTarget();
  $("link-dialog").close();
  const ed = editor();
  if (range) ed.setSelection(range);
  ed.makeLink(url);
  updateToolbar();
});
$("link-remove").addEventListener("click", () => {
  const range = linkTarget();
  $("link-dialog").close();
  const ed = editor();
  if (range) ed.setSelection(range);
  ed.removeLink();
  updateToolbar();
  setStatus(t("mailbox.link_removed"));
});
$("link-cancel").addEventListener("click", () => $("link-dialog").close());
// Back to the text after the dialog, with the caret where it was.
$("link-dialog").addEventListener("close", () => { if (isHtmlCompose()) editor().focus(); });

function composeValues() {
  const values = {to: $("c-to").value, cc: $("c-cc").value, bcc: $("c-bcc").value,
                  subject: $("c-subject").value};
  if (isHtmlCompose()) {
    // The server derives the plain-text part from the HTML itself; the
    // editor's text is sent along only as a readable fallback.
    values.body = $("c-editor").innerText || "";
    values.html = editor().getHTML();
  } else {
    values.body = $("c-body").value;
  }
  return values;
}

const composeDirty = () => !!S.compose && JSON.stringify(composeValues()) !== JSON.stringify(S.compose.initial);

function showBcc() {
  $("c-bcc-field").hidden = false;
  $("c-bcc-toggle").setAttribute("aria-expanded", "true");
  $("c-bcc-toggle-wrap").hidden = true;
  reportSize();
}

async function startCompose(action) {
  if (S.compose && S.compose.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  if (!(await leaveCompose())) return;
  const m = action === "new" ? null : S.open;
  if (action !== "new" && !m) return;
  const opener = document.activeElement;
  const account = S.account;
  setStatus(t("mailbox.compose_preparing"));
  let prep;
  try {
    prep = await callTool("imap_panel_compose_prepare", m
      ? {account, action, folder: m.folder, uid: m.uid, uidvalidity: m.uidvalidity}
      : {account, action});
  } catch (err) {
    if (account !== S.account) return;
    if (isStale(err)) {
      closeMessage();
      $("list-heading").focus();
      loadList({reset: true, staleRetry: true, notice: t("mailbox.stale_retry")});
      return;
    }
    setStatus(t("mailbox.compose_error_prepare", {detail: err.message}), true);
    return;
  }
  if (account !== S.account) return;
  const acc = currentAccount();
  if (acc && prep.send_mode) { acc.send_mode = prep.send_mode; acc.send_approval = prep.send_approval; }
  if (!prep.allowed) {
    renderPermissions();
    renderMessage();
    setStatus(t("mailbox.compose_not_allowed"), true);
    if (opener && opener.isConnected && opener.offsetParent !== null) opener.focus(); else $("list-heading").focus();
    return;
  }
  const source = m ? {folder: prep.folder || m.folder, uid: prep.uid || m.uid, uidvalidity: prep.uidvalidity || m.uidvalidity} : null;
  S.compose = {action, prep, source, busy: false, initial: null};
  fillCompose(prep);
  S.compose.initial = composeValues();
  $("compose").hidden = false;
  renderMessage();
  if (narrowQuery.matches) setView("message");
  $("read-pane").scrollTop = 0;
  reportSize();
  focusFirstComposeField(action);
  setStatus("");
}

// Decodes MIME encoded words (=?utf-8?b?...?= and =?utf-8?q?...?=), which
// the server can return in recipient names, so the field shows "Åsa".
function decodeWords(text) {
  return String(text).replace(/=\?([^?\s]+)\?([bBqQ])\?([^?\s]*)\?=(\s+(?==\?))?/g, (whole, charset, enc, data) => {
    try {
      let bytes;
      if (enc.toUpperCase() === "B") {
        bytes = Uint8Array.from(atob(data), ch => ch.charCodeAt(0));
      } else {
        const raw = data.replace(/_/g, " ").replace(/=([0-9A-Fa-f]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
        bytes = Uint8Array.from(raw, ch => ch.charCodeAt(0));
      }
      return new TextDecoder(charset).decode(bytes);
    } catch (e) {
      return whole;
    }
  });
}

// One recipient for a text field: a decoded name, quoted when it holds a
// separator so that splitRecipients keeps it whole.
function recipientText(value) {
  const named = String(value).match(/^(.*?)\s*<([^<>]+)>$/);
  if (!named || !named[1]) return String(value);
  let name = decodeWords(named[1].trim());
  if (/^".*"$/.test(name)) name = name.slice(1, -1).replace(/\\(.)/g, "$1");
  if (/[,;"<>@]/.test(name)) name = `"${name.replace(/(["\\])/g, "\\$1")}"`;
  return `${name} <${named[2]}>`;
}

function fillCompose(prep) {
  const join = list => (Array.isArray(list) ? list : []).map(recipientText).join(", ");
  $("c-to").value = join(prep.to);
  $("c-cc").value = join(prep.cc);
  $("c-bcc").value = join(prep.bcc);
  $("c-subject").value = prep.subject || "";
  const html = prep.format === "html" && editorAvailable();
  S.compose.html = html;
  $("c-body").hidden = html;
  $("c-editor-wrap").hidden = !html;
  // In HTML mode the label names the editor (aria-labelledby); a "for"
  // pointing at the hidden text field would make clicks on it do nothing.
  if (html) $("c-body-label").removeAttribute("for"); else $("c-body-label").setAttribute("for", "c-body");
  $("c-body").value = html ? "" : (prep.body || "");
  $("c-body").scrollTop = 0;
  if (html) {
    editor().setHTML(prep.body_html || "");
    $("c-editor").scrollTop = 0;
    updateToolbar();
  }
  const hasBcc = (prep.bcc || []).length > 0;
  $("c-bcc-field").hidden = !hasBcc;
  $("c-bcc-toggle-wrap").hidden = hasBcc;
  $("c-bcc-toggle").setAttribute("aria-expanded", hasBcc ? "true" : "false");
  clearComposeErrors();
  $("compose-progress").hidden = true;
  renderComposeTexts();
}

// Everything in the compose view that depends on the language.
function renderComposeTexts() {
  const c = S.compose;
  if (!c) return;
  const prep = c.prep;
  $("compose-heading").textContent = t(`mailbox.compose_heading.${c.action}`);
  const acc = currentAccount();
  $("compose-from").textContent = acc ? (acc.display_name && acc.display_name !== acc.email ? `${acc.display_name} <${acc.email}>` : acc.email) : "";
  const warning = prep.reply_to_warning;
  $("compose-replyto").hidden = !warning;
  if (warning) {
    $("compose-replyto-text").textContent = t("mailbox.compose_replyto_warning", {
      reply_to: (warning.reply_to || []).join(", "), sender: warning.sender || ""});
  }
  // A reply or forward draft opened for editing: the quotation stays below
  // the field, read-only, and the server adds it back when saving.
  const keptHtml = c.html && prep.kept_quote_html ? prep.kept_quote_html : "";
  $("compose-kept").hidden = !(keptHtml || prep.kept_quote);
  $("compose-kept-text").hidden = !!keptHtml;
  $("compose-kept-text").textContent = keptHtml ? "" : (prep.kept_quote || "");
  $("compose-kept-html").hidden = !keptHtml;
  $("compose-kept-html").replaceChildren(keptHtml ? sanitizedFragment(keptHtml, PURIFY_QUOTE) : "");
  // A reply or forward is written in the original's format; say which.
  let formatNote = "";
  if (["reply", "reply_all", "forward"].includes(c.action)) {
    formatNote = t(`mailbox.compose_format_note.${c.action === "forward" ? "forward" : "reply"}_${c.html ? "html" : "text"}`);
  }
  $("c-format-note").hidden = !formatNote;
  $("c-format-note").textContent = formatNote;
  const described = [formatNote && "c-format-note", c.html && "c-editor-hint"].filter(Boolean).join(" ");
  for (const id of ["c-body", "c-editor"]) {
    if (described) $(id).setAttribute("aria-describedby", described); else $(id).removeAttribute("aria-describedby");
  }
  renderToolbarNames();
  $("compose-quote").hidden = !prep.quoted_from;
  $("compose-quote").textContent = prep.quoted_from ? t("mailbox.compose_quote_note", {address: prep.quoted_from}) : "";
  const missing = Array.isArray(prep.attachments_not_included) ? prep.attachments_not_included : [];
  $("compose-not-included").hidden = missing.length === 0;
  const ul = $("compose-not-included-list");
  ul.textContent = "";
  for (const name of missing) ul.append(el("li", {text: name || t("mailbox.unnamed_attachment")}));
  const canSend = prep.send_mode === "send";
  $("c-send").hidden = !canSend;
  $("c-send").className = canSend ? "primary" : "";
  $("c-save").className = canSend ? "" : "primary";
  $("compose-send-note").textContent = canSend
    ? t(prep.send_approval === "never" ? "mailbox.compose_send_note.never" : "mailbox.compose_send_note.ask")
    : t("mailbox.compose_drafts_only");
  $("c-allow-wrap").hidden = !(canSend && prep.send_approval === "ask_or_window");
  $("c-allow-label").textContent = t("mailbox.review_allow", {minutes: prep.allow_minutes || 30});
  resetSendGate();
}

function focusFirstComposeField(action) {
  let target = "c-body";
  if (action === "new" || action === "forward") target = "c-to";
  else if (action === "edit_draft") target = ["c-to", "c-subject", "c-body"].find(id => !$(id).value.trim()) || "c-body";
  if (target === "c-body" && isHtmlCompose()) {
    editor().focus();
    editor().moveCursorToStart();
  } else {
    const field = $(target);
    field.focus();
    if (target === "c-body") field.setSelectionRange(0, 0);
  }
  // Setting the value leaves the caret at the end, and focusing scrolls to
  // it; the text must start at the top, or the send gate would count it as
  // read without the user having seen anything.
  bodyElement().scrollTop = 0;
}

function closeCompose() {
  S.compose = null;
  if (squire) squire.setHTML("");
  hideTip();
  $("c-allow").checked = false;
  $("compose").hidden = true;
  clearComposeErrors();
  renderMessage();
  if (!S.open && narrowQuery.matches) setView("list");
  reportSize();
}

// Focus after the compose view has closed: the message, or the list.
function focusAfterCompose() {
  if (S.open && !$("msg").hidden) $("msg-subject").focus();
  else $("list-heading").focus();
}

const confirmDiscard = () => confirmDialog(t("mailbox.compose_confirm_title"), t("mailbox.compose_confirm_text"),
                                           t("mailbox.compose_discard"), t("mailbox.compose_keep_writing"));

// Closes the compose view before something else is shown. Returns false
// when the user wants to keep writing (or a save is under way).
async function leaveCompose() {
  if (!S.compose) return true;
  if (S.compose.busy) { setStatus(t("mailbox.compose_busy"), true); return false; }
  if (composeDirty() && !(await confirmDiscard())) return false;
  closeCompose();
  return true;
}

async function cancelCompose() {
  if (!S.compose) return;
  if (S.compose.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  const dirty = composeDirty();
  if (dirty && !(await confirmDiscard())) { $("c-cancel").focus(); return; }
  closeCompose();
  focusAfterCompose();
  setStatus(dirty ? t("mailbox.compose_discarded") : "");
}

function clearComposeErrors() {
  for (const f of COMPOSE_FIELDS) {
    $(`c-${f}-field`).classList.remove("invalid");
    $(`c-${f}`).removeAttribute("aria-invalid");
    $(`c-${f}`).setAttribute("aria-describedby", "c-rcpt-hint");
    $(`c-${f}-error`).hidden = true;
    $(`c-${f}-error`).textContent = "";
  }
  $("compose-errors").hidden = true;
  $("compose-errors-list").textContent = "";
}

// errors: [{field: "to" | "cc" | "bcc" | null, message}]
function showComposeErrors(errors) {
  clearComposeErrors();
  const byField = {};
  for (const e of errors) if (e.field) (byField[e.field] = byField[e.field] || []).push(e.message);
  for (const [f, messages] of Object.entries(byField)) {
    if (f === "bcc") showBcc();
    $(`c-${f}-field`).classList.add("invalid");
    $(`c-${f}`).setAttribute("aria-invalid", "true");
    $(`c-${f}`).setAttribute("aria-describedby", `c-${f}-error c-rcpt-hint`);
    $(`c-${f}-error`).textContent = messages.join(" ");
    $(`c-${f}-error`).hidden = false;
  }
  const ul = $("compose-errors-list");
  for (const e of errors) {
    if (e.field) {
      const label = t(`mailbox.compose_${e.field}`);
      const link = el("button", {type: "button", class: "link", text: t("mailbox.compose_error_field", {field: label, message: e.message})});
      link.addEventListener("click", () => $(`c-${e.field}`).focus());
      ul.append(el("li", {}, link));
    } else {
      ul.append(el("li", {text: e.message}));
    }
  }
  $("compose-errors").hidden = false;
  reportSize();
  $("compose-errors").focus();
  setStatus(t("mailbox.compose_errors_heading"), true);
}

function validateCompose() {
  const raw = composeValues();
  const values = {subject: raw.subject.trim(), body: raw.body};
  if (raw.html != null) values.body_html = raw.html;
  const errors = [];
  for (const f of COMPOSE_FIELDS) {
    values[f] = splitRecipients(raw[f]);
    for (const item of values[f]) {
      if (!validRecipient(item)) errors.push({field: f, message: t("mailbox.compose_error_address", {address: item})});
    }
  }
  if (!errors.length && !COMPOSE_FIELDS.some(f => values[f].length)) {
    errors.push({field: "to", message: t("mailbox.compose_error_no_recipient")});
  }
  return {values, errors};
}

function setComposeBusy(busy, text) {
  if (S.compose) S.compose.busy = busy;
  // aria-disabled rather than disabled, so that focus stays on the button.
  for (const id of ["c-save", "c-cancel"]) {
    if (busy) $(id).setAttribute("aria-disabled", "true"); else $(id).removeAttribute("aria-disabled");
  }
  renderSendGate();
  $("compose-progress").hidden = !busy;
  $("compose-progress").textContent = busy ? (text || "") : "";
}

async function deliverCompose(kind) {
  const c = S.compose;
  if (!c) return;
  if (c.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  const {values, errors} = validateCompose();
  if (errors.length) { showComposeErrors(errors); return; }
  clearComposeErrors();
  const progress = t(kind === "send" ? "mailbox.compose_sending" : "mailbox.compose_saving");
  setComposeBusy(true, progress);
  setStatus(progress);
  const src = c.source || {};
  let result;
  try {
    const args = {
      account: S.account, action: c.action, body: values.body,
      to: values.to, cc: values.cc, bcc: values.bcc, subject: values.subject,
      folder: src.folder || "", uid: src.uid || 0, uidvalidity: src.uidvalidity || 0, deliver: kind,
    };
    if (values.body_html != null) args.body_html = values.body_html;
    result = await callTool("imap_panel_compose_deliver", args);
  } catch (err) {
    setComposeBusy(false);
    if (S.compose === c) deliverFailed(err, kind);
    return;
  }
  setComposeBusy(false);
  if (S.compose === c) await deliverDone(c, result);
}

function deliverFailed(err, kind) {
  const text = String(err.message || "");
  if (/\bNot sent\b/.test(text)) {
    showComposeErrors([{field: "to", message: t("mailbox.compose_replyto_refused")}]);
    return;
  }
  // "Invalid e-mail address: 'x'" or "Could not read the recipient 'x'".
  const found = text.match(/(?:address:?|recipient)\s+(['"])(.+?)\1/);
  if (found) {
    const address = found[2];
    const field = COMPOSE_FIELDS.find(f => $(`c-${f}`).value.includes(address));
    if (field) {
      showComposeErrors([{field, message: t("mailbox.compose_error_server_address", {address})}]);
      return;
    }
  }
  const key = kind === "send" ? "mailbox.compose_error_send" : "mailbox.compose_error_save";
  showComposeErrors([{field: null, message: t(key, {detail: text})}]);
}

async function deliverDone(c, result) {
  const status = result.status;
  const where = result.folder ? folderLabel(result.folder) : t("mailbox.folder.drafts");
  const parts = [];
  if (status === "sent") {
    parts.push(t("mailbox.compose_sent"));
    const until = Number(result.sending_allowed_without_review_until);
    if (until > 0) parts.push(t("mailbox.compose_sent_window", {time: fmtTime(new Date(until * 1000))}));
  } else parts.push(t("mailbox.compose_saved", {folder: where}));
  if (result.reply_to_warning && status !== "sent") parts.push(t("mailbox.compose_draft_replyto"));
  if (c.action === "edit_draft" && "old_draft_moved_to_trash" in result) {
    parts.push(result.old_draft_moved_to_trash
      ? t("mailbox.compose_old_draft_trashed")
      : t("mailbox.compose_old_draft_kept", {folder: folderLabel(c.source.folder)}));
  }
  const notice = parts.join(" ");
  closeCompose();
  // The old draft is in the trash now: it is no longer the open message.
  if (c.action === "edit_draft" && result.old_draft_moved_to_trash && S.open
      && S.open.uid === c.source.uid && S.open.folder === c.source.folder) {
    S.open = null;
    renderMessage();
    if (narrowQuery.matches) setView("list");
  }
  loadFolders();
  await loadList({notice});
  // An edited draft that was saved again opens anew, ready to read or edit.
  if (c.action === "edit_draft" && status !== "sent" && result.uid && result.folder === S.folder) {
    await openMessage(Number(result.uid), {uidvalidity: result.uidvalidity, direct: true, notice});
    return;
  }
  focusAfterCompose();
}

// ---------------------------------------------------------------------------
// Sending from the compose view
// ---------------------------------------------------------------------------
// Send is pressed in the same view where the text is read and written. It
// becomes available once the message text has been scrolled to its end
// (or fits without scrolling). On pressing it, the panel asks the server
// for an approval of exactly the current values and sends with it, so what
// goes out is what was on screen.

function composeArgs(c, values) {
  const args = {account: S.account, action: c.action, body: values.body, to: values.to,
                cc: values.cc, bcc: values.bcc, subject: values.subject};
  if (values.body_html != null) args.body_html = values.body_html;
  if (c.source) Object.assign(args, {folder: c.source.folder, uid: c.source.uid, uidvalidity: c.source.uidvalidity});
  return args;
}

// The server says so when the client cannot show this panel; that is no
// fault in the form, so it is told in the status line.
const isAppsRefusal = err => /MCP Apps/.test(String(err && err.message));

function resetSendGate() {
  if (S.compose) S.compose.read = false;
  // Consent to skip later questions is given per message, never carried over.
  $("c-allow").checked = false;
  renderSendGate();
  // Run after layout so a short text that needs no scrolling counts as read.
  requestAnimationFrame(checkSendGate);
}

// aria-disabled, not disabled, so Send stays focusable and its description
// (the hint above it) says why it cannot be pressed yet.
function renderSendGate() {
  const c = S.compose;
  const visible = !!c && !$("c-send").hidden;
  const ready = !!(c && c.read);
  const button = $("c-send");
  if (!visible || !ready || (c && c.busy)) button.setAttribute("aria-disabled", "true");
  else button.removeAttribute("aria-disabled");
  $("compose-gate").hidden = !visible || ready;
  if (visible && !ready) button.setAttribute("aria-describedby", "compose-gate");
  else button.removeAttribute("aria-describedby");
}

function checkSendGate() {
  const c = S.compose;
  if (!c || c.read || $("c-send").hidden) return;
  const body = bodyElement();
  if (body.scrollTop + body.clientHeight >= body.scrollHeight - 2) {
    c.read = true;
    renderSendGate();
    if (body.scrollHeight > body.clientHeight + 1) setStatus(t("mailbox.compose_gate_ready"));
  }
}
// Mouse, touch and keyboard (arrows, Page Down, Cmd/Ctrl+End) all scroll
// the text box, so all of them count.
// Typing is not reading: only scrolling and moving through the text count.
for (const id of ["c-body", "c-editor"]) {
  for (const type of ["scroll", "keyup"]) $(id).addEventListener(type, checkSendGate, {passive: true});
}

async function sendCompose() {
  const c = S.compose;
  if (!c) return;
  if (c.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  if (!c.read) { setStatus(t("mailbox.compose_gate"), true); bodyElement().focus(); return; }
  const {values, errors} = validateCompose();
  if (errors.length) { showComposeErrors(errors); return; }
  clearComposeErrors();
  const progress = t("mailbox.compose_sending");
  setComposeBusy(true, progress);
  setStatus(progress);
  let result;
  try {
    const args = composeArgs(c, values);
    const review = await callTool("imap_panel_compose_review", args);
    result = await callTool("imap_panel_compose_deliver", {
      ...args, deliver: "send", approval_token: review.approval_token,
      allow_window: !!(review.can_allow_window && $("c-allow").checked),
    });
  } catch (err) {
    setComposeBusy(false);
    if (S.compose !== c) return;
    if (isAppsRefusal(err)) { setStatus(t("mailbox.compose_error_send", {detail: err.message}), true); return; }
    deliverFailed(err, "send");
    return;
  }
  setComposeBusy(false);
  if (S.compose === c) await deliverDone(c, result);
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
$("account").addEventListener("change", async e => {
  const wanted = e.target.value;
  if (!(await leaveCompose())) { e.target.value = S.account; return; }
  selectAccount(wanted, "INBOX");
});

$("folder-list").addEventListener("click", e => {
  const button = e.target.closest("button[data-folder]");
  if (!button) return;
  const name = button.dataset.folder;
  S.query.text = "";
  $("q").value = "";
  S.selected.clear();
  const collapse = !wideQuery.matches;
  if (name !== S.folder) {
    S.folder = name;
    closeMessage();
    renderFolders();
    loadList({reset: true});
  }
  if (collapse) {
    $("folders-details").open = false;
    $("folders-summary").focus();
  }
});

$("folder-list").addEventListener("keydown", e => {
  if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
  const buttons = [...$("folder-list").querySelectorAll("button[data-folder]")];
  const i = buttons.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const j = e.key === "Home" ? 0 : e.key === "End" ? buttons.length - 1 : Math.max(0, Math.min(buttons.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
  for (const b of buttons) b.setAttribute("tabindex", b === buttons[j] ? "0" : "-1");
  buttons[j].focus();
});

function runSearch() {
  S.query.text = $("q").value.trim();
  closeMessage();
  loadList({reset: true});
}
$("search-button").addEventListener("click", runSearch);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runSearch(); } });
$("f-unseen").addEventListener("change", e => { S.query.unseen = e.target.checked; closeMessage(); loadList({reset: true}); });
$("f-flagged").addEventListener("change", e => { S.query.flagged = e.target.checked; closeMessage(); loadList({reset: true}); });

$("message-list").addEventListener("click", async e => {
  const button = e.target.closest('[data-kind="open"]');
  if (!button) return;
  const uid = Number(button.closest("li").dataset.uid);
  if (!(await leaveCompose())) return;
  openMessage(uid);
});
$("message-list").addEventListener("change", e => {
  if (e.target.dataset.kind !== "check") return;
  const uid = Number(e.target.closest("li").dataset.uid);
  if (e.target.checked) S.selected.add(uid); else S.selected.delete(uid);
  setActiveRow(uid);
  renderBulk();
  setStatus(tn("mailbox.selected_count", S.selected.size));
});
$("message-list").addEventListener("focusin", e => {
  const li = e.target.closest("li[data-uid]");
  if (li) setActiveRow(Number(li.dataset.uid));
});
$("message-list").addEventListener("keydown", e => {
  if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
  const li = e.target.closest("li[data-uid]");
  if (!li) return;
  e.preventDefault();
  const rows = rowElements();
  const i = rows.indexOf(li);
  const j = e.key === "Home" ? 0 : e.key === "End" ? rows.length - 1 : Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
  focusRow(Number(rows[j].dataset.uid), e.target.dataset.kind);
});

$("more").addEventListener("click", () => loadList({append: true}));
$("back").addEventListener("click", () => { if (S.compose) cancelCompose(); else backToList(); });
$("read-pane").addEventListener("keydown", e => {
  // While writing, Escape does nothing: it is too easy to press by mistake.
  if (e.key === "Escape" && narrowQuery.matches && !S.compose && !$("confirm").open) { e.preventDefault(); backToList(); }
});

$("act-read").addEventListener("click", () => {
  if (!S.open) return;
  runAction((S.open.flags || []).includes("\\Seen") ? "mark_unread" : "mark_read", [S.open.uid]);
});
$("act-flag").addEventListener("click", () => {
  if (!S.open) return;
  runAction((S.open.flags || []).includes("\\Flagged") ? "unflag" : "flag", [S.open.uid]);
});
$("act-trash").addEventListener("click", () => { if (S.open) runAction("trash", [S.open.uid]); });
$("act-move").addEventListener("click", () => { if (S.open) runAction("move", [S.open.uid], {destination: $("act-dest").value, select: $("act-dest")}); });
$("act-ask").addEventListener("click", askAboutMessage);
$("act-reply").addEventListener("click", () => startCompose("reply"));
$("act-reply-all").addEventListener("click", () => startCompose("reply_all"));
$("act-forward").addEventListener("click", () => startCompose("forward"));
$("act-edit-draft").addEventListener("click", () => startCompose("edit_draft"));
$("new-message").addEventListener("click", () => startCompose("new"));
$("c-save").addEventListener("click", () => deliverCompose("draft"));
$("c-send").addEventListener("click", sendCompose);
$("c-cancel").addEventListener("click", cancelCompose);
$("c-bcc-toggle").addEventListener("click", () => { showBcc(); $("c-bcc").focus(); });
$("act-kb").addEventListener("click", suggestReply);
$("att-save").addEventListener("click", saveAttachments);

$("bulk").addEventListener("click", e => {
  const button = e.target.closest("button[data-bulk]");
  if (!button) return;
  const uids = S.list.messages.map(m => m.uid).filter(u => S.selected.has(u));
  const action = button.dataset.bulk;

});
$("bulk-clear").addEventListener("click", () => {
  S.selected.clear();
  renderList();
  if (!focusRow(S.activeUid, "check")) $("list-heading").focus();
});

$("side-open").addEventListener("click", () => requestDisplayMode("fullscreen"));
$("display-mode").addEventListener("click", () => {
  // The user's choice: no more switching by itself in this panel.

});

$("ask-settings").addEventListener("click", async () => {
  try {
    await request("ui/message", {role: "user", content: [{type: "text", text: t("mailbox.empty_ask_text")}]});
    setStatus(t("mailbox.asked_settings"));
  } catch (e) {
    setStatus(t("mailbox.ask_failed_settings"), true);
  }
});

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------
S.lang = pickLang(navigator.language);
applyStaticTexts();
setStatus(t("mailbox.connecting"));

(async () => {
  try {
    const init = await request("ui/initialize", {
      protocolVersion: UI_PROTOCOL,
      appInfo: {name: "imap-mcp-connector-mailbox", version: "1.0.1"},
      appCapabilities: {availableDisplayModes: ["inline", "fullscreen"]},
    });
    const ctx = (init && init.hostContext) || {};
    S.host = hostLabel(init && init.hostInfo);
    if (!ctx.locale) S.lang = pickLang(navigator.language);
    applyStaticTexts();
    applyHostContext(ctx);
    notify("ui/notifications/initialized", {});
    autoDisplayMode();
    reportSize();
  } catch (err) {
    setStatus(t("mailbox.connect_failed"), true);
  }
})();
</script>
</body>
</html>
