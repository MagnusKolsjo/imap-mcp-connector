  $("c-bcc-toggle").setAttribute("aria-expanded", hasBcc ? "true" : "false");
  clearComposeErrors();
  $("compose-progress").hidden = true;
  renderComposeTexts();
}

// Everything in the compose view that depends on the language.
function renderComposeTexts() {
  const c = S.compose;
  if (!c) return;
  const prep = c.prep;
  $("compose-heading").textContent = t(`mailbox.compose_heading.${c.action}`);
  const acc = currentAccount();
  $("compose-from").textContent = acc ? (acc.display_name && acc.display_name !== acc.email ? `${acc.display_name} <${acc.email}>` : acc.email) : "";
  const warning = prep.reply_to_warning;
  $("compose-replyto").hidden = !warning;
  if (warning) {
    $("compose-replyto-text").textContent = t("mailbox.compose_replyto_warning", {
      reply_to: (warning.reply_to || []).join(", "), sender: warning.sender || ""});
  }
  // A reply or forward draft opened for editing: the quotation stays below
  // the field, read-only, and the server adds it back when saving.
  $("compose-kept").hidden = !prep.kept_quote;
  $("compose-kept-text").textContent = prep.kept_quote || "";
  $("compose-quote").hidden = !prep.quoted_from;
  $("compose-quote").textContent = prep.quoted_from ? t("mailbox.compose_quote_note", {address: prep.quoted_from}) : "";
  const missing = Array.isArray(prep.attachments_not_included) ? prep.attachments_not_included : [];
  $("compose-not-included").hidden = missing.length === 0;
  const ul = $("compose-not-included-list");
  ul.textContent = "";
  for (const name of missing) ul.append(el("li", {text: name || t("mailbox.unnamed_attachment")}));
  const canSend = prep.send_mode === "send";
  $("c-send").hidden = !canSend;
  $("c-send").className = canSend ? "primary" : "";
  $("c-save").className = canSend ? "" : "primary";
  $("compose-send-note").textContent = canSend
    ? t(prep.send_approval === "never" ? "mailbox.compose_send_note.never" : "mailbox.compose_send_note.ask")
    : t("mailbox.compose_drafts_only");
  if (c.review) renderReview();
}

function focusFirstComposeField(action) {
  let target = "c-body";
  if (action === "new" || action === "forward") target = "c-to";
  else if (action === "edit_draft") target = ["c-to", "c-subject", "c-body"].find(id => !$(id).value.trim()) || "c-body";
  const field = $(target);
  field.focus();
  if (target === "c-body") field.setSelectionRange(0, 0);
}

function closeCompose() {
  stopReviewWatch();
  S.compose = null;
  $("compose").hidden = true;
  $("review").hidden = true;
  clearComposeErrors();
  renderMessage();
  if (!S.open && narrowQuery.matches) setView("list");
  reportSize();
}

// Focus after the compose view has closed: the message, or the list.
function focusAfterCompose() {
  if (S.open && !$("msg").hidden) $("msg-subject").focus();
  else $("list-heading").focus();
}

const confirmDiscard = () => confirmDialog(t("mailbox.compose_confirm_title"), t("mailbox.compose_confirm_text"),
                                           t("mailbox.compose_discard"), t("mailbox.compose_keep_writing"));

// Closes the compose view before something else is shown. Returns false
// when the user wants to keep writing (or a save is under way).
async function leaveCompose() {
  if (!S.compose) return true;
  if (S.compose.busy) { setStatus(t("mailbox.compose_busy"), true); return false; }
  if (composeDirty() && !(await confirmDiscard())) return false;
  closeCompose();
  return true;
}

async function cancelCompose() {
  if (!S.compose) return;
  if (S.compose.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  const dirty = composeDirty();
  if (dirty && !(await confirmDiscard())) { $("c-cancel").focus(); return; }
  closeCompose();
  focusAfterCompose();
  setStatus(dirty ? t("mailbox.compose_discarded") : "");
}

function clearComposeErrors() {
  for (const f of COMPOSE_FIELDS) {
    $(`c-${f}-field`).classList.remove("invalid");
    $(`c-${f}`).removeAttribute("aria-invalid");
    $(`c-${f}`).setAttribute("aria-describedby", "c-rcpt-hint");
    $(`c-${f}-error`).hidden = true;
    $(`c-${f}-error`).textContent = "";
  }
  $("compose-errors").hidden = true;
  $("compose-errors-list").textContent = "";
}

// errors: [{field: "to" | "cc" | "bcc" | null, message}]
function showComposeErrors(errors) {
  clearComposeErrors();
  const byField = {};
  for (const e of errors) if (e.field) (byField[e.field] = byField[e.field] || []).push(e.message);
  for (const [f, messages] of Object.entries(byField)) {
    if (f === "bcc") showBcc();
    $(`c-${f}-field`).classList.add("invalid");
    $(`c-${f}`).setAttribute("aria-invalid", "true");
    $(`c-${f}`).setAttribute("aria-describedby", `c-${f}-error c-rcpt-hint`);
    $(`c-${f}-error`).textContent = messages.join(" ");
    $(`c-${f}-error`).hidden = false;
  }
  const ul = $("compose-errors-list");
  for (const e of errors) {
    if (e.field) {
      const label = t(`mailbox.compose_${e.field}`);
      const link = el("button", {type: "button", class: "link", text: t("mailbox.compose_error_field", {field: label, message: e.message})});
      link.addEventListener("click", () => $(`c-${e.field}`).focus());
      ul.append(el("li", {}, link));
    } else {
      ul.append(el("li", {text: e.message}));
    }
  }
  $("compose-errors").hidden = false;
  reportSize();
  $("compose-errors").focus();
  setStatus(t("mailbox.compose_errors_heading"), true);
}

function validateCompose() {
  const raw = composeValues();
  const values = {subject: raw.subject.trim(), body: raw.body};
  const errors = [];
  for (const f of COMPOSE_FIELDS) {
    values[f] = splitRecipients(raw[f]);
    for (const item of values[f]) {
      if (!validRecipient(item)) errors.push({field: f, message: t("mailbox.compose_error_address", {address: item})});
    }
  }
  if (!errors.length && !COMPOSE_FIELDS.some(f => values[f].length)) {
    errors.push({field: "to", message: t("mailbox.compose_error_no_recipient")});
  }
  return {values, errors};
}

function setComposeBusy(busy, text) {
  if (S.compose) S.compose.busy = busy;
  // aria-disabled rather than disabled, so that focus stays on the button.
  for (const id of ["c-save", "c-send", "c-cancel", "review-back"]) {
    if (busy) $(id).setAttribute("aria-disabled", "true"); else $(id).removeAttribute("aria-disabled");
  }
  renderReviewSend();
  for (const id of ["compose-progress", "review-progress"]) {
    $(id).hidden = !busy;
    $(id).textContent = busy ? (text || "") : "";
  }
}

async function deliverCompose(kind) {
  const c = S.compose;
  if (!c) return;
  if (c.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  const {values, errors} = validateCompose();
  if (errors.length) { showComposeErrors(errors); return; }
  clearComposeErrors();
  const progress = t(kind === "send" ? "mailbox.compose_sending" : "mailbox.compose_saving");
  setComposeBusy(true, progress);
  setStatus(progress);
  const src = c.source || {};
  let result;
  try {
    result = await callTool("imap_panel_compose_deliver", {
      account: S.account, action: c.action, body: values.body,
      to: values.to, cc: values.cc, bcc: values.bcc, subject: values.subject,
      folder: src.folder || "", uid: src.uid || 0, uidvalidity: src.uidvalidity || 0, deliver: kind,
    });
  } catch (err) {
    setComposeBusy(false);
    if (S.compose === c) deliverFailed(err, kind);
    return;
  }
  setComposeBusy(false);
  if (S.compose === c) await deliverDone(c, result);
}

function deliverFailed(err, kind) {
  const text = String(err.message || "");
  if (/\bNot sent\b/.test(text)) {
    showComposeErrors([{field: "to", message: t("mailbox.compose_replyto_refused")}]);
    return;
  }
  // "Invalid e-mail address: 'x'" or "Could not read the recipient 'x'".
  const found = text.match(/(?:address:?|recipient)\s+(['"])(.+?)\1/);
  if (found) {
    const address = found[2];
    const field = COMPOSE_FIELDS.find(f => $(`c-${f}`).value.includes(address));
    if (field) {
      showComposeErrors([{field, message: t("mailbox.compose_error_server_address", {address})}]);
      return;
    }
  }
  const key = {send: "mailbox.compose_error_send", review: "mailbox.review_error_prepare"}[kind] || "mailbox.compose_error_save";
  showComposeErrors([{field: null, message: t(key, {detail: text})}]);
}

async function deliverDone(c, result) {
  const status = result.status;
  const where = result.folder ? folderLabel(result.folder) : t("mailbox.folder.drafts");
  const parts = [];
  if (status === "sent") {
    parts.push(t("mailbox.compose_sent"));
    const until = Number(result.sending_allowed_without_review_until);
    if (until > 0) parts.push(t("mailbox.compose_sent_window", {time: fmtTime(new Date(until * 1000))}));
  } else parts.push(t("mailbox.compose_saved", {folder: where}));
  if (result.reply_to_warning && status !== "sent") parts.push(t("mailbox.compose_draft_replyto"));
  if (c.action === "edit_draft" && "old_draft_moved_to_trash" in result) {
    parts.push(result.old_draft_moved_to_trash
      ? t("mailbox.compose_old_draft_trashed")
      : t("mailbox.compose_old_draft_kept", {folder: folderLabel(c.source.folder)}));
  }
  const notice = parts.join(" ");
  closeCompose();
  // The old draft is in the trash now: it is no longer the open message.
  if (c.action === "edit_draft" && result.old_draft_moved_to_trash && S.open
      && S.open.uid === c.source.uid && S.open.folder === c.source.folder) {
    S.open = null;
    renderMessage();
    if (narrowQuery.matches) setView("list");
  }
  loadFolders();
  await loadList({notice});
  // An edited draft that was saved again opens anew, ready to read or edit.
  if (c.action === "edit_draft" && status !== "sent" && result.uid && result.folder === S.folder) {
    await openMessage(Number(result.uid), {uidvalidity: result.uidvalidity, direct: true, notice});
    return;
  }
  focusAfterCompose();
}

// ---------------------------------------------------------------------------
// Review before sending
// ---------------------------------------------------------------------------
// Sending is always approved here, in the panel, never by the AI tool: the
// server returns the complete message exactly as it would go out, with a
// token that approves only that message. Send works once the end of the
// text has been in view, and uses exactly the values that were reviewed.
let reviewObserver = null;

function composeArgs(c, values) {
  const src = c.source || {};
  return {account: S.account, action: c.action, body: values.body,
          to: values.to, cc: values.cc, bcc: values.bcc, subject: values.subject,
          folder: src.folder || "", uid: src.uid || 0, uidvalidity: src.uidvalidity || 0};
}

// The server says so when the client cannot show this panel's review; that
// is no fault in the form, so it is told in the status line.
const isAppsRefusal = err => /MCP Apps/.test(String(err && err.message));

async function fetchReview(c, values) {
  return callTool("imap_panel_compose_review", composeArgs(c, values));
}

async function reviewCompose() {
  const c = S.compose;
  if (!c) return;
  if (c.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  const {values, errors} = validateCompose();
  if (errors.length) { showComposeErrors(errors); return; }
  clearComposeErrors();
  setComposeBusy(true, t("mailbox.review_preparing"));
  setStatus(t("mailbox.review_preparing"));
  let data;
  try {
    data = await fetchReview(c, values);
  } catch (err) {
    setComposeBusy(false);
    if (S.compose !== c) return;
    if (isAppsRefusal(err)) setStatus(t("mailbox.review_error_prepare", {detail: err.message}), true);
    else deliverFailed(err, "review");
    return;
  }
  setComposeBusy(false);
  if (S.compose !== c) return;
  c.review = {values, data, ready: false};
  showReview();
}

function showReview() {
  $("compose").hidden = true;
  $("review").hidden = false;
  $("review-errors").hidden = true;
  $("review-allow").checked = false;
  renderReview();
  $("read-pane").scrollTop = 0;
  $("review-scroll").scrollTop = 0;
  renderReviewSend();
  reportSize();
  $("review-heading").focus();
  setStatus("");
  watchReviewEnd();
}

function renderReview() {
  const r = S.compose && S.compose.review;
  if (!r) return;
  const d = r.data;
  const dl = $("review-headers");
  dl.textContent = "";
  const join = list => (Array.isArray(list) ? list : []).map(recipientText).join(", ");
  const rows = [["mailbox.compose_from", join(d.from)], ["mailbox.compose_to", join(d.to)],
                ["mailbox.compose_cc", join(d.cc)], ["mailbox.compose_bcc", join(d.bcc)],
                ["mailbox.compose_subject", d.subject || t("mailbox.no_subject")]];
  for (const [key, value] of rows) if (value) dl.append(el("dt", {text: t(key)}), el("dd", {text: value}));
  $("review-text").textContent = d.text || "";
  const warning = d.reply_to_warning;
  $("review-replyto").hidden = !warning;
  $("review-replyto-text").textContent = warning ? t("mailbox.compose_replyto_warning", {
    reply_to: (warning.reply_to || []).join(", "), sender: warning.sender || ""}) : "";
  $("review-allow-wrap").hidden = !d.can_allow_window;
  $("review-allow-label").textContent = t("mailbox.review_allow", {minutes: d.allow_minutes || 30});
}

// Send is aria-disabled, not disabled, so that it stays focusable and its
// description (the hint above it) says why it cannot be pressed yet.
function renderReviewSend() {
  const c = S.compose;
  const r = c && c.review;
  const ready = !!(r && r.ready);
  const button = $("review-send");
  if ((c && c.busy) || !ready) button.setAttribute("aria-disabled", "true");
  else button.removeAttribute("aria-disabled");
  $("review-gate").hidden = ready;
  if (ready) button.removeAttribute("aria-describedby");
  else button.setAttribute("aria-describedby", "review-gate");
}

function stopReviewWatch() {
  if (reviewObserver) { reviewObserver.disconnect(); reviewObserver = null; }
}

// The end of the text counts as read when a marker after it has been in
// view inside the scroll box, by mouse, touch or keyboard alike; a text
// that fits without scrolling counts at once.
function watchReviewEnd() {
  stopReviewWatch();
  const scroller = $("review-scroll");
  if (typeof IntersectionObserver === "function") {
    reviewObserver = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) reachedReviewEnd();
    }, {root: scroller, threshold: 0});
    reviewObserver.observe($("review-end"));
  }
  checkReviewEnd();
}

function checkReviewEnd() {
  const scroller = $("review-scroll");
  if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) reachedReviewEnd();
}
$("review-scroll").addEventListener("scroll", checkReviewEnd, {passive: true});

function reachedReviewEnd() {
  const r = S.compose && S.compose.review;
  if (!r || r.ready || $("review").hidden) return;
  r.ready = true;
  stopReviewWatch();
  renderReviewSend();
  const scroller = $("review-scroll");
  if (scroller.scrollHeight > scroller.clientHeight + 1) setStatus(t("mailbox.review_ready"));
}

function showReviewError(text) {
  $("review-errors-text").textContent = text;
  $("review-errors").hidden = false;
  reportSize();
  $("review-errors").focus();
  setStatus(text, true);
}

function backToEditing() {
  const c = S.compose;
  if (!c || !c.review) return;
  if (c.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  stopReviewWatch();
  c.review = null;
  $("review").hidden = true;
  $("compose").hidden = false;
  reportSize();
  $("c-body").focus();
  setStatus("");
}

// A new review of the same values, for example after the approval expired.
async function reReview(c, notice) {
  const values = c.review.values;
  setComposeBusy(true, t("mailbox.review_preparing"));
  let data;
  try {
    data = await fetchReview(c, values);
  } catch (err) {
    setComposeBusy(false);
    if (S.compose === c) showReviewError(t("mailbox.review_error_prepare", {detail: err.message}));
    return;
  }
  setComposeBusy(false);
  if (S.compose !== c) return;
  c.review = {values, data, ready: false};
  showReview();
  showReviewError(notice);
}

async function sendReviewed() {
  const c = S.compose;
  const r = c && c.review;
  if (!r) return;
  if (c.busy) { setStatus(t("mailbox.compose_busy"), true); return; }
  if (!r.ready) { setStatus(t("mailbox.review_gate"), true); $("review-scroll").focus(); return; }
  const progress = t("mailbox.compose_sending");
  setComposeBusy(true, progress);
  setStatus(progress);
  let result;
  try {
    result = await callTool("imap_panel_compose_deliver", {
      ...composeArgs(c, r.values), deliver: "send",
      approval_token: r.data.approval_token,
      allow_window: !!(r.data.can_allow_window && $("review-allow").checked),
    });
  } catch (err) {
    setComposeBusy(false);
    if (S.compose !== c) return;
    const text = String(err.message || "");
    if (/does not match|expired/i.test(text)) { await reReview(c, t("mailbox.review_expired")); return; }
    if (isAppsRefusal(err)) { setStatus(t("mailbox.compose_error_send", {detail: text}), true); return; }
    if (/\bNot sent\b/.test(text)) { backToEditing(); deliverFailed(err, "send"); return; }
    showReviewError(t("mailbox.compose_error_send", {detail: text}));
    return;
  }
  setComposeBusy(false);
  if (S.compose === c) await deliverDone(c, result);
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
$("account").addEventListener("change", async e => {
  const wanted = e.target.value;
  if (!(await leaveCompose())) { e.target.value = S.account; return; }
  selectAccount(wanted, "INBOX");
});

$("folder-list").addEventListener("click", e => {
  const button = e.target.closest("button[data-folder]");
  if (!button) return;
  const name = button.dataset.folder;
  S.query.text = "";
  $("q").value = "";
  S.selected.clear();
  const collapse = !wideQuery.matches;
  if (name !== S.folder) {
    S.folder = name;
    closeMessage();
    renderFolders();
    loadList({reset: true});
  }
  if (collapse) {
    $("folders-details").open = false;
    $("folders-summary").focus();
  }
});

$("folder-list").addEventListener("keydown", e => {
  if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
  const buttons = [...$("folder-list").querySelectorAll("button[data-folder]")];
  const i = buttons.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const j = e.key === "Home" ? 0 : e.key === "End" ? buttons.length - 1 : Math.max(0, Math.min(buttons.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
  for (const b of buttons) b.setAttribute("tabindex", b === buttons[j] ? "0" : "-1");
  buttons[j].focus();
});

function runSearch() {
  S.query.text = $("q").value.trim();
  closeMessage();
  loadList({reset: true});
}
$("search-button").addEventListener("click", runSearch);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runSearch(); } });
$("f-unseen").addEventListener("change", e => { S.query.unseen = e.target.checked; closeMessage(); loadList({reset: true}); });
$("f-flagged").addEventListener("change", e => { S.query.flagged = e.target.checked; closeMessage(); loadList({reset: true}); });

$("message-list").addEventListener("click", async e => {
  const button = e.target.closest('[data-kind="open"]');
  if (!button) return;
  const uid = Number(button.closest("li").dataset.uid);
  if (!(await leaveCompose())) return;
  openMessage(uid);
});
$("message-list").addEventListener("change", e => {
  if (e.target.dataset.kind !== "check") return;
  const uid = Number(e.target.closest("li").dataset.uid);
  if (e.target.checked) S.selected.add(uid); else S.selected.delete(uid);
  setActiveRow(uid);
  renderBulk();
  setStatus(tn("mailbox.selected_count", S.selected.size));
});
$("message-list").addEventListener("focusin", e => {
  const li = e.target.closest("li[data-uid]");
  if (li) setActiveRow(Number(li.dataset.uid));
});
$("message-list").addEventListener("keydown", e => {
  if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
  const li = e.target.closest("li[data-uid]");
  if (!li) return;
  e.preventDefault();
  const rows = rowElements();
  const i = rows.indexOf(li);
  const j = e.key === "Home" ? 0 : e.key === "End" ? rows.length - 1 : Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
  focusRow(Number(rows[j].dataset.uid), e.target.dataset.kind);
});

$("more").addEventListener("click", () => loadList({append: true}));
$("back").addEventListener("click", () => { if (S.compose) cancelCompose(); else backToList(); });
$("read-pane").addEventListener("keydown", e => {
  // While writing, Escape does nothing: it is too easy to press by mistake.
  if (e.key === "Escape" && narrowQuery.matches && !S.compose && !$("confirm").open) { e.preventDefault(); backToList(); }
});

$("act-read").addEventListener("click", () => {
  if (!S.open) return;
  runAction((S.open.flags || []).includes("\\Seen") ? "mark_unread" : "mark_read", [S.open.uid]);
});
$("act-flag").addEventListener("click", () => {
  if (!S.open) return;
  runAction((S.open.flags || []).includes("\\Flagged") ? "unflag" : "flag", [S.open.uid]);
});
$("act-trash").addEventListener("click", () => { if (S.open) runAction("trash", [S.open.uid]); });
$("act-move").addEventListener("click", () => { if (S.open) runAction("move", [S.open.uid], {destination: $("act-dest").value, select: $("act-dest")}); });
$("act-ask").addEventListener("click", askAboutMessage);
$("act-reply").addEventListener("click", () => startCompose("reply"));
$("act-reply-all").addEventListener("click", () => startCompose("reply_all"));
$("act-forward").addEventListener("click", () => startCompose("forward"));
$("act-edit-draft").addEventListener("click", () => startCompose("edit_draft"));
$("new-message").addEventListener("click", () => startCompose("new"));
$("c-save").addEventListener("click", () => deliverCompose("draft"));
$("c-send").addEventListener("click", reviewCompose);
$("review-send").addEventListener("click", sendReviewed);
$("review-back").addEventListener("click", backToEditing);
$("c-cancel").addEventListener("click", cancelCompose);
$("c-bcc-toggle").addEventListener("click", () => { showBcc(); $("c-bcc").focus(); });
$("act-kb").addEventListener("click", suggestReply);
$("att-save").addEventListener("click", saveAttachments);

$("bulk").addEventListener("click", e => {
  const button = e.target.closest("button[data-bulk]");
  if (!button) return;
  const uids = S.list.messages.map(m => m.uid).filter(u => S.selected.has(u));
  const action = button.dataset.bulk;
  runAction(action, uids, action === "move" ? {destination: $("bulk-dest").value, select: $("bulk-dest")} : {});
});
$("bulk-clear").addEventListener("click", () => {
  S.selected.clear();
  renderList();
  if (!focusRow(S.activeUid, "check")) $("list-heading").focus();
});

$("side-open").addEventListener("click", () => requestDisplayMode("fullscreen"));
$("display-mode").addEventListener("click", () => {
  // The user's choice: no more switching by itself in this panel.
  S.stayInline = true;
  requestDisplayMode("inline");
});

$("ask-settings").addEventListener("click", async () => {
  try {
    await request("ui/message", {role: "user", content: [{type: "text", text: t("mailbox.empty_ask_text")}]});
    setStatus(t("mailbox.asked_settings"));
  } catch (e) {
    setStatus(t("mailbox.ask_failed_settings"), true);
  }
});

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------
S.lang = pickLang(navigator.language);
applyStaticTexts();
setStatus(t("mailbox.connecting"));

(async () => {
  try {
    const init = await request("ui/initialize", {
      protocolVersion: UI_PROTOCOL,
      appInfo: {name: "imap-mcp-connector-mailbox", version: "1.0.0"},
      appCapabilities: {availableDisplayModes: ["inline", "fullscreen"]},
    });
    const ctx = (init && init.hostContext) || {};
    S.host = hostLabel(init && init.hostInfo);
    if (!ctx.locale) S.lang = pickLang(navigator.language);
    applyStaticTexts();
    applyHostContext(ctx);
    notify("ui/notifications/initialized", {});
    autoDisplayMode();
    reportSize();
  } catch (err) {
    setStatus(t("mailbox.connect_failed"), true);
  }
})();
</script>
</body>
</html>
