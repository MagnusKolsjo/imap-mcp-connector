<!--
  Mailbox panel (MCP App). Folders, message list and reading pane.

  Everything shown here is fetched by the panel itself through app-only
  tools, so what the user browses never passes through the model. The only
  way a message reaches the model is one of the two ask buttons (a question
  about the message, or a reply suggested from the knowledge base). Each
  posts a reference (account, folder, uid, uidvalidity, subject) and lets
  the model read the message with its own tool; the body is never sent.

  Server data is only ever inserted with textContent, with two exceptions
  that go through DOMPurify with a fixed allowlist first: HTML loaded into
  the formatting editor (Squire) and the read-only quotation of an HTML
  draft. The file is self-contained: the iframe's CSP blocks every external
  request, so the server inlines the two libraries from panels/vendor/
  (see panels/THIRD_PARTY_LICENSES.md) in place of the placeholders below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailbox</title>
<style>
/* Design system "Magnus Kolsjö", tokens copied from admin/static/app.css.
   Contrast (WCAG 2.1), light / dark:
     svarta on papper 14.5 / 13.6, on papper-2 13.0 / 11.8
     svarta-dampad on papper 6.3 / 7.6, on papper-2 5.6 / 6.5
     skiffer on papper 8.3 / 7.3, on papper-2 7.5 / 6.3 (links, focus, bars)
     pa-skiffer on skiffer 8.3 / 7.3 (primary buttons)
     lader on papper 5.2 / 6.9 (errors)
     linje-stark on papper 3.4 / 3.7, on papper-2 3.05 / 3.2 (control borders)
   motljus is never used. */
:root {
  color-scheme: light;
  --papper: #F6F1E9;
  --papper-2: #EDE5D8;
  --linje: #D8CFC2;
  --linje-stark: #8C8174;
  --svarta: #22201C;
  --svarta-dampad: #5E5850;
  --skiffer: #2E4A5C;
  --pa-skiffer: #F6F1E9;
  --lader: #8A5A3C;
  --ang: #4A6638;
  --motljus: #C9963A;
  --fokus: var(--skiffer);

  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Source Code Pro", Menlo, Consolas, monospace;

  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --panel-height: 38rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --papper: #1A1E22;
    --papper-2: #252A2F;
    --linje: #3A4047;
    --linje-stark: #6E7781;
    --svarta: #EDE7DC;
    --svarta-dampad: #B5ADA2;
    --skiffer: #8FB0C6;
    --pa-skiffer: #1A1E22;
    --lader: #D19A73;
    --ang: #9DB98A;
    --motljus: #E0B45E;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --papper: #1A1E22;
  --papper-2: #252A2F;
  --linje: #3A4047;
  --linje-stark: #6E7781;
  --svarta: #EDE7DC;
  --svarta-dampad: #B5ADA2;
  --skiffer: #8FB0C6;
  --pa-skiffer: #1A1E22;
  --lader: #D19A73;
  --ang: #9DB98A;
  --motljus: #E0B45E;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { font-size: 100%; }
body {
  margin: 0;
  background: var(--papper);
  color: var(--svarta);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
:root[data-mode="fullscreen"] body { height: 100vh; display: flex; flex-direction: column; }
:root[data-mode="fullscreen"] .layout { flex: 1 1 auto; height: auto; min-height: 0; }

:focus-visible { outline: 2px solid var(--fokus); outline-offset: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; line-height: 1.25; margin: 0; }
h1 { font-size: 1.125rem; }
h2 { font-size: 1.0625rem; }
h3 { font-size: 1rem; }
h4 { font-size: 0.9375rem; font-family: var(--sans); }
p { margin: 0; }

/* ---- Controls ------------------------------------------------------------ */
button, select, input, textarea { font: inherit; color: inherit; }
button {
  min-height: 2rem;
  padding: var(--space-1) var(--space-3);
  background: var(--papper);
  color: var(--svarta);
  border: 1px solid var(--linje-stark);
  border-radius: 0;
  cursor: pointer;
  line-height: 1.3;
  text-align: center;
}
button:hover { background: var(--papper-2); }
button.primary { background: var(--skiffer); color: var(--pa-skiffer); border-color: var(--skiffer); }
button.primary:hover { text-decoration: underline; text-underline-offset: 0.15em; }
button.link {
  border: 0; background: none; padding: var(--space-1) 0; min-height: 1.5rem;
  color: var(--skiffer); text-decoration: underline; text-underline-offset: 0.15em;
}
button.link:hover { text-decoration-thickness: 2px; }
select, input[type="search"] {
  min-height: 2rem;
  padding: var(--space-1) var(--space-2);
  background: var(--papper);
  border: 1px solid var(--linje-stark);
  border-radius: 2px;
  max-width: 100%;
}
input[type="checkbox"] { width: 1.125rem; height: 1.125rem; margin: 0; accent-color: var(--skiffer); flex: none; }
label { cursor: pointer; }
.check { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 1.5rem; }

.muted { color: var(--svarta-dampad); }
.small { font-size: 0.875rem; }

/* ---- Top bar --------------------------------------------------------------- */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4);
  justify-content: space-between;
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--linje);
}
.top-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--space-2); min-width: 0; }
.top-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
.field-inline { display: inline-flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

/* ---- Side panel offer (inline only) ------------------------------------------ */
.side-offer {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  padding: var(--space-3);
  background: var(--papper-2);
  border-bottom: 1px solid var(--linje);
}
.side-offer button.primary { min-height: 2.5rem; padding: var(--space-2) var(--space-4); font-weight: 600; }
.side-offer p { font-size: 0.9375rem; color: var(--svarta-dampad); }

/* ---- Empty state ------------------------------------------------------------ */
.empty { padding: var(--space-4) var(--space-3); display: grid; gap: var(--space-3); justify-items: start; max-width: 40rem; }

/* ---- Layout ----------------------------------------------------------------- */
.layout { height: var(--panel-height); display: flex; flex-direction: column; min-height: 0; }
.pane { min-width: 0; min-height: 0; }
/* The folder menu keeps its own height in the column layout: as a flex
   item with min-height 0 it would otherwise shrink to nothing and the list
   heading would cover the summary. When open, the list scrolls inside a
   bounded area so the message list stays reachable. */
#folders-nav { border-bottom: 1px solid var(--linje); flex: 0 0 auto; }
@media (max-width: 899.98px) {
  #folders-details[open] .folders-inner { max-height: 16rem; overflow: auto; }
  :root[data-mode="fullscreen"] #folders-details[open] .folders-inner { max-height: min(24rem, 45vh); }
}
#list-pane { display: flex; flex-direction: column; flex: 1 1 auto; }
#read-pane { flex: 1 1 auto; overflow: auto; padding: var(--space-3); }

/* Narrow: one pane at a time. */
@media (max-width: 639.98px) {
  .layout[data-view="list"] #read-pane { display: none; }
  .layout[data-view="message"] #list-pane,
  .layout[data-view="message"] #folders-nav { display: none; }
}
/* Medium: folders above, list and message side by side. */
@media (min-width: 640px) {
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-rows: auto minmax(0, 1fr); }
  #folders-nav { grid-column: 1 / -1; }
  #list-pane { border-right: 1px solid var(--linje); }
  .narrow-only { display: none; }
}
/* Wide: folders, list and message in three columns. */
@media (min-width: 900px) {
  .layout { grid-template-columns: 13rem minmax(0, 1fr) minmax(0, 1.35fr); grid-template-rows: minmax(0, 1fr); }
  #folders-nav { grid-column: auto; border-bottom: 0; border-right: 1px solid var(--linje); overflow: auto; }
  #folders-details > summary { display: none; }
}

/* ---- Folders ---------------------------------------------------------------- */
#folders-details > summary {
  padding: var(--space-2) var(--space-3);
  cursor: pointer;
  min-height: 2rem;
}
#folders-details > summary:hover { background: var(--papper-2); }
.folders-inner { padding: var(--space-2) var(--space-3) var(--space-3); }
.folders-inner h2 { margin-bottom: var(--space-2); }
.folder-list { list-style: none; margin: 0; padding: 2px; display: grid; gap: 2px; }
.folder-list button {
  width: 100%;
  display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2);
  text-align: left;
  border: 0; border-left: 3px solid transparent;
  background: none;
  padding: var(--space-1) var(--space-2);
}
.folder-list button:hover { background: var(--papper-2); }
.folder-list button[aria-current="true"] { background: var(--papper-2); border-left-color: var(--skiffer); font-weight: 600; }
.folder-list .noselect { padding: var(--space-1) var(--space-2); color: var(--svarta-dampad); display: block; }
.folder-count { font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---- Message list ----------------------------------------------------------- */
.list-head { padding: var(--space-2) var(--space-3); display: grid; gap: var(--space-2); border-bottom: 1px solid var(--linje); }
.list-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); }
.list-title-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--space-2); min-width: 0; }
.list-updated { font-size: 0.8125rem; color: var(--svarta-dampad); font-variant-numeric: tabular-nums; }
.list-updated:empty { display: none; }
.search-row { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); align-items: center; }
.search-label { flex: 1 1 100%; font-size: 0.875rem; color: var(--svarta-dampad); }
.search-row input { flex: 1 1 10rem; min-width: 0; }
.filters { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); border: 0; margin: 0; padding: 0; min-width: 0; }
.filters legend { padding: 0; font-size: 0.875rem; color: var(--svarta-dampad); float: left; width: 100%; }
.notice { font-size: 0.875rem; color: var(--svarta-dampad); border-left: 3px solid var(--linje-stark); padding-left: var(--space-2); }
.bulk { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-2); background: var(--papper-2); border: 1px solid var(--linje); }
.bulk-count { font-weight: 600; margin-right: var(--space-2); }
.list-scroll { flex: 1 1 auto; overflow: auto; min-height: 0; }
.message-list { list-style: none; margin: 0; padding: 3px; }
.message-list > li { display: flex; align-items: stretch; gap: var(--space-2); border-bottom: 1px solid var(--linje); }
.message-list > li > .row-check { display: flex; align-items: flex-start; padding: var(--space-3) 0 0 var(--space-2); }
.row-open {
  flex: 1 1 auto; min-width: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 var(--space-2);
  text-align: left;
  border: 0; border-left: 4px solid transparent;
  background: none;
  padding: var(--space-2) var(--space-2);
}
.row-open:hover { background: var(--papper-2); }
.row-open[aria-current="true"] { background: var(--papper-2); border-left-color: var(--skiffer); }
.row-from, .row-subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-date { color: var(--svarta-dampad); font-size: 0.875rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-subject { grid-column: 1 / -1; }
.row-tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--space-1); }
.row-tags:empty { display: none; }
.unread .row-from, .unread .row-subject { font-weight: 600; }
.tag {
  display: inline-block;
  font-size: 0.8125rem; line-height: 1.35;
  padding: 0 var(--space-1);
  border: 1px solid var(--linje-stark);
  color: var(--svarta);
  font-weight: 400;
}
.list-foot { padding: var(--space-2) var(--space-3) var(--space-3); display: grid; gap: var(--space-2); justify-items: start; }
.list-empty { padding: var(--space-4) var(--space-3); color: var(--svarta-dampad); }

/* ---- Reading pane ------------------------------------------------------------ */
.read-placeholder { color: var(--svarta-dampad); padding: var(--space-2) 0; }
#msg { display: grid; gap: var(--space-3); }
#msg-subject { font-size: 1.25rem; }
.headers { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 var(--space-3); margin: 0; font-size: 0.9375rem; }
.headers dt { color: var(--svarta-dampad); }
.headers dd { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-2) 0; border-top: 1px solid var(--linje); border-bottom: 1px solid var(--linje); }
.move { display: inline-flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.body.html { white-space: normal; }
.body.html table { max-width: 100%; border-collapse: collapse; }
.body.html td, .body.html th { padding: 2px 4px; vertical-align: top; }
.body.html a { color: var(--skiffer); }
.body.html img { max-width: 100%; height: auto; }
/* A sender's own layout assumes a light page, as in other mail programs;
   it keeps one in the dark theme too so its colours stay readable. */
.body.html.sender-layout { background: #ffffff; color: #1a1a1a; padding: 8px; }
.body.html.sender-layout a { color: #1f4e79; }
.external { margin: 0 0 12px; padding: 8px 12px; border: 1px solid var(--linje); background: var(--papper-2); }
.external p { margin: 0 0 8px; }
.ext-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.55;
  margin: 0;
  max-width: 48rem;
}
.attachments ul { margin: var(--space-1) 0 0; padding-left: 1.25rem; }
.attachments li { margin-bottom: var(--space-1); }
.save-action { margin-top: var(--space-2); }
button[aria-disabled="true"] { cursor: progress; }
.save-result { margin-top: var(--space-3); padding-top: var(--space-2); border-top: 1px solid var(--linje); display: grid; gap: var(--space-2); }
.attachments .save-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.save-list > li { margin: 0; padding-left: var(--space-2); border-left: 3px solid var(--linje-stark); }
.save-list > li.quarantine { border-left: 5px solid var(--lader); }
.save-name { font-weight: 600; }
.tag.tag-quarantine { color: var(--lader); border-color: var(--lader); font-weight: 600; margin-left: var(--space-1); }
.save-path, .save-folder { font-family: var(--mono); font-size: 0.8125rem; overflow-wrap: anywhere; }
.save-path { display: block; color: var(--svarta-dampad); }

/* ---- Compose ------------------------------------------------------------------ */
.compose { display: grid; gap: var(--space-3); max-width: 48rem; }
#compose-heading { margin-top: var(--space-2); font-size: 1.25rem; }
.error-summary button.link { text-align: left; display: inline; }
.compose-from { font-size: 0.9375rem; }
.cfield { display: grid; gap: var(--space-1); }
.cfield > label { font-weight: 600; }
.hint { font-size: 0.875rem; color: var(--svarta-dampad); }
.compose input[type="text"], .compose textarea {
  width: 100%; min-height: 2.5rem;
  padding: var(--space-2);
  background: var(--papper);
  border: 1px solid var(--linje-stark);
  border-radius: 2px;
}
.compose textarea { min-height: 14rem; resize: vertical; line-height: 1.5; }
.cfield.invalid input, .cfield.invalid textarea { border: 2px solid var(--lader); }
.field-error { color: var(--lader); font-weight: 600; font-size: 0.9375rem; }
.error-summary { border: 2px solid var(--lader); padding: var(--space-3); display: grid; gap: var(--space-2); }
.error-summary h4 { color: var(--lader); }
.error-summary ul { margin: 0; padding-left: 1.25rem; }
.error-summary li { margin-bottom: var(--space-1); }
.warning { border-left: 5px solid var(--lader); padding: var(--space-2) var(--space-3); background: var(--papper-2); }
.compose-buttons { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding-top: var(--space-2); border-top: 1px solid var(--linje); }
.compose-progress { font-weight: 600; }
.compose .notice ul { margin: var(--space-1) 0 0; padding-left: 1.25rem; }
.compose-kept { display: grid; gap: var(--space-1); }
.compose-kept pre {
  margin: 0; padding: var(--space-2) var(--space-3);
  max-height: 14rem; overflow: auto;
  white-space: pre-wrap; overflow-wrap: anywhere;
  font-family: var(--sans); font-size: 0.9375rem; line-height: 1.5;
  color: var(--svarta-dampad); background: var(--papper-2);
  border-left: 3px solid var(--linje-stark);
}
button.link[aria-expanded] { min-height: 1.5rem; }
.kept-html {
  max-height: 14rem; overflow: auto;
  padding: var(--space-2) var(--space-3);
  font-size: 0.9375rem; line-height: 1.5;
  color: var(--svarta-dampad); background: var(--papper-2);
  border-left: 3px solid var(--linje-stark);
}

/* ---- Formatting editor -------------------------------------------------------- */
.editor-wrap { display: grid; gap: 0; }
#c-editor-hint { margin-top: var(--space-1); }
.editor-toolbar {
  display: flex; flex-wrap: wrap; gap: var(--space-1);
  padding: var(--space-1);
  background: var(--papper-2);
  border: 1px solid var(--linje-stark); border-bottom: 0;
  border-radius: 2px 2px 0 0;
}
.toolbar-wrap { position: relative; }
.editor-toolbar button {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2rem; height: 2rem; min-height: 2rem; padding: 0;
}
.editor-toolbar svg { display: block; flex: none; }
.editor-toolbar button[aria-pressed="true"] {
  background: var(--skiffer); color: var(--pa-skiffer); border-color: var(--skiffer);
}
.editor-toolbar button[aria-disabled="true"] { color: var(--svarta-dampad); border-style: dashed; cursor: not-allowed; }
/* Shown on hover (after a short delay) and on keyboard focus; Escape hides
   it. It sits right under the button so the pointer can move onto it. */
.fmt-tip {
  position: absolute; z-index: 5;
  padding: var(--space-1) var(--space-2);
  background: var(--svarta); color: var(--papper);
  font-size: 0.875rem; line-height: 1.35; white-space: nowrap;
  border-radius: 2px;
}
@media (forced-colors: active) {
  .fmt-tip { border: 1px solid CanvasText; }
}
.editor {
  min-height: 14rem; max-height: 22rem; overflow: auto;
  padding: var(--space-2);
  background: var(--papper);
  border: 1px solid var(--linje-stark);
  border-radius: 0 0 2px 2px;
  line-height: 1.5;
  cursor: text;
}
.editor:focus-visible, .editor:focus { outline: 2px solid var(--fokus); outline-offset: 2px; }
.editor blockquote, .kept-html blockquote { margin: var(--space-2) 0; padding-left: var(--space-3); border-left: 3px solid var(--linje-stark); color: var(--svarta-dampad); }
.editor ul, .editor ol, .kept-html ul, .kept-html ol { margin: var(--space-1) 0; padding-left: 1.5rem; }
.editor a { color: var(--skiffer); text-decoration: underline; }
.editor p, .kept-html p { margin: 0 0 var(--space-2); }
.editor pre, .kept-html pre { white-space: pre-wrap; font-family: var(--mono); font-size: 0.875rem; }
.kept-html table { border-collapse: collapse; }
.kept-html td, .kept-html th { border: 1px solid var(--linje); padding: var(--space-1); }
.link-field input { width: 100%; min-height: 2.5rem; padding: var(--space-2); background: var(--papper); border: 1px solid var(--linje-stark); border-radius: 2px; }
.link-field.invalid input { border: 2px solid var(--lader); }
#link-form h2 { margin-bottom: var(--space-3); }
#link-form .dialog-buttons { margin-top: var(--space-4); }
@media (forced-colors: active) {
  .editor-toolbar button[aria-pressed="true"] { outline: 2px solid Highlight; }
}

/* ---- Review before sending ------------------------------------------------------ */
.review-allow { display: flex; }
.review-gate { font-weight: 600; }
button.primary[aria-disabled="true"] {
  background: var(--papper); color: var(--svarta-dampad);
  border: 1px dashed var(--linje-stark); cursor: not-allowed; text-decoration: none;
}

/* ---- Status and privacy ------------------------------------------------------- */
.status { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--linje); min-height: 2.5rem; }
.status.error { color: var(--lader); font-weight: 600; }
.privacy { padding: var(--space-2) var(--space-3) var(--space-3); border-top: 1px solid var(--linje); font-size: 0.875rem; color: var(--svarta-dampad); display: grid; gap: var(--space-1); }

/* ---- Confirmation dialog ------------------------------------------------------- */
dialog {
  background: var(--papper); color: var(--svarta);
  border: 1px solid var(--linje-stark); border-radius: 0;
  padding: var(--space-4); max-width: min(30rem, calc(100vw - 2rem));
}
dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
dialog p { margin: var(--space-2) 0 var(--space-4); }

<script>
"use strict";

// ---------------------------------------------------------------------------
// Translations
// ---------------------------------------------------------------------------
// The server embeds {lang: {key: text}} in place of the I18N placeholder.
const STRINGS = (I18N && typeof I18N === "object") ? I18N : {};

const S = {
  host: null,
  lang: "en",
  hostLocale: "",
  accounts: [],
  account: "",
  folder: "INBOX",
  folders: [],
  list: {messages: [], total: 0, next_offset: null, uidvalidity: 0, search_note: null, highUid: 0},
  query: {text: "", unseen: false, flagged: false},
  open: null,              // the message shown in the reading pane
  activeUid: null,         // roving focus position in the message list
  selected: new Set(),     // UIDs ticked for bulk actions
  organise: false,
  readMarking: "never",
  displayModes: [],
  displayMode: "inline",
  autoDisplayTried: false, // the side panel is asked for once at start,
  gestureTried: false,     // once more on the first click or key press,
  stayInline: false,       // and never again after "Show in the conversation"
  compose: null,           // {action, prep, source, busy, initial} while writing
  started: false,
  listSeq: 0,
  saveResult: null,        // {key, data} from the last save in the reading pane
  saving: false,
  inFlight: 0,             // tool calls under way
  callCount: 0,            // tool calls started, to spot overlapping refreshes
};

function pickLang(locale) {
  const code = String(locale || "").trim();
  const base = code.split("-")[0].toLowerCase();
  if (code && STRINGS[code]) return code;
  if (base && STRINGS[base]) return base;
  return "en";
}

function lookup(key) {
  const own = STRINGS[S.lang] || {};
  const en = STRINGS.en || {};
  return own[key] != null ? own[key] : (en[key] != null ? en[key] : key);
}

// The AI tool's own name, as the host reports it in ui/initialize, so that
// buttons can say "Ask <tool> about this message" in any MCP client. Only a
// human-readable display name is used; a technical id such as "some-client"
// or no name at all falls back to a neutral wording.
function hostLabel(info) {
  if (!info || typeof info !== "object") return null;
  const ok = v => typeof v === "string" && v.length <= 40 && /^\p{Lu}[\p{L}\p{N} .+&'’-]*$/u.test(v.trim());
  if (ok(info.title)) return info.title.trim();
  if (ok(info.name) && !/[_/]/.test(info.name)) return info.name.trim();
  return null;
}

function t(key, values) {
  let text = lookup(key);
  const all = {host: S.host || lookup("mailbox.host_fallback"), ...(values || {})};
  return text.replace(/\{(\w+)\}/g, (m, k) => (k in all ? String(all[k]) : m));
}

// Plural forms are separate keys: key.one and key.other.
function tn(key, n, values) {
  let form = "other";
  try { form = new Intl.PluralRules(S.lang).select(n) === "one" ? "one" : "other"; } catch (e) { /* keep other */ }
  return t(`${key}.${form}`, Object.assign({n}, values || {}));
}

function intlLocale() {
  const host = S.hostLocale || "";
  if (host && host.toLowerCase().split("-")[0] === S.lang) return host;
  return S.lang === "sv" ? "sv-SE" : S.lang;
}

function applyStaticTexts() {
  document.documentElement.lang = S.lang;
  document.title = t("mailbox.doc_title");
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  document.getElementById("msg-body").setAttribute("aria-label", t("mailbox.body_label"));
}

// ---------------------------------------------------------------------------
// Small DOM helpers. Server data only ever goes in through textContent.
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("data-") || k.startsWith("aria-") || k === "role" || k === "tabindex" || k === "id" || k === "type" || k === "for" || k === "title" || k === "datetime") node.setAttribute(k, v === true ? "" : String(v));
    else node[k] = v;
  }
  for (const child of children) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

let statusTimer = null;
function setStatus(text, isError) {
  const box = $("status");
  clearTimeout(statusTimer);
  // Empty first so that a repeated message is announced again.
  box.textContent = "";
  box.classList.toggle("error", !!isError);
  statusTimer = setTimeout(() => { box.textContent = text || ""; }, 50);
}

// ---------------------------------------------------------------------------
// Formatting
// ---------------------------------------------------------------------------
function fmtListDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const now = new Date();
  try {
    if (d.toDateString() === now.toDateString()) {
      return new Intl.DateTimeFormat(intlLocale(), {hour: "2-digit", minute: "2-digit"}).format(d);
    }
    if (d.getFullYear() === now.getFullYear()) {
      return new Intl.DateTimeFormat(intlLocale(), {day: "numeric", month: "short"}).format(d);
    }
    return new Intl.DateTimeFormat(intlLocale(), {dateStyle: "medium"}).format(d);
  } catch (e) {
    return d.toISOString().slice(0, 10);
  }
}

function fmtLongDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  try {
    return new Intl.DateTimeFormat(intlLocale(), {dateStyle: "full", timeStyle: "short"}).format(d);
  } catch (e) {
    return d.toString();
  }
}

function fmtSize(bytes) {
  const n = Number(bytes) || 0;
  const [value, unit] = n >= 1048576 ? [n / 1048576, "megabyte"] : n >= 1024 ? [n / 1024, "kilobyte"] : [n, "byte"];
  try {
    return new Intl.NumberFormat(intlLocale(), {style: "unit", unit, unitDisplay: "short", maximumFractionDigits: unit === "megabyte" ? 1 : 0}).format(value);
  } catch (e) {
    return `${Math.round(value)} ${unit}`;
  }
}

function fmtAddress(a) {
  if (!a) return "";
  return a.name ? `${a.name} <${a.email}>` : (a.email || "");
}
const fmtAddresses = list => (list || []).map(fmtAddress).join(", ");
const senderName = list => (list && list[0]) ? (list[0].name || list[0].email) : t("mailbox.no_sender");

// ---------------------------------------------------------------------------
// Folders: display names
// ---------------------------------------------------------------------------
const SPECIAL_ORDER = ["inbox", "drafts", "sent", "archive", "junk", "trash", "all", "flagged"];

function folderKind(f) {
  if (String(f.name).toUpperCase() === "INBOX") return "inbox";
  return f.special_use || null;
}

function folderInfo(name) {
  return S.folders.find(f => f.name === name) || {name, delimiter: "/", special_use: null};
}

// Full, readable path such as "Projekt › 2026", with special folders translated.
function folderLabel(name) {
  const f = folderInfo(name);
  const kind = folderKind(f);
  if (kind) return t(`mailbox.folder.${kind}`);
  const parts = f.delimiter ? String(name).split(f.delimiter).filter(Boolean) : [String(name)];
  return parts.join(" › ");
}

function sortedFolders() {
  const rank = f => {
    const kind = folderKind(f);
    const i = kind ? SPECIAL_ORDER.indexOf(kind) : -1;
    return i < 0 ? SPECIAL_ORDER.length : i;
  };
  return [...S.folders].sort((a, b) => rank(a) - rank(b) || String(a.name).localeCompare(String(b.name), intlLocale()));
}

function currentAccount() {
  return S.accounts.find(a => a.id === S.account) || null;
}

// ---------------------------------------------------------------------------
// Host protocol: JSON-RPC over postMessage
// ---------------------------------------------------------------------------
const UI_PROTOCOL = "2026-01-26";
let nextId = 1;

function request(method, params) {
  const id = nextId++;
  window.parent.postMessage({jsonrpc: "2.0", id, method, params}, "*");
  return new Promise((resolve, reject) => {
    window.addEventListener("message", function listen(e) {
      // Only the host (the window embedding the panel) may answer.
      if (e.source !== window.parent || !e.data || e.data.id !== id) return;
      // A response carries result or error; a request carries method.
      if (e.data.method !== undefined) return;
      window.removeEventListener("message", listen);
      if (e.data.error) reject(new Error(e.data.error.message || "error"));
      else resolve(e.data.result);
    });
  });
}
const notify = (method, params) => window.parent.postMessage({jsonrpc: "2.0", method, params}, "*");

class ToolFailure extends Error {}

// The server's "Cannot reach the mail server host:port (...)" is shown in
// the panel's language, with what to check.
function readableFailure(text) {
  const m = /^Cannot reach the mail server (\S+?):(\d+)\b/.exec(String(text || ""));
  return m ? t("mailbox.unreachable", {host: m[1], port: m[2]}) : text;
}

async function callTool(name, args) {
  let result;
  S.inFlight++;
  S.callCount++;
  try {
    result = await request("tools/call", {name, arguments: args});
  } catch (e) {
    throw new ToolFailure(e.message || t("mailbox.unknown_error"));
  } finally {
    S.inFlight--;
  }
  if (result && result.isError) {
    const text = (result.content || []).map(c => c && c.text).filter(Boolean).join(" ");
    throw new ToolFailure(readableFailure(text) || t("mailbox.unknown_error"));
  }
  return (result && (result.structuredContent || result.structured_content)) || {};
}

// The server reports a changed UIDVALIDITY as "...renumbered by the server
// (uidvalidity A -> B)...". The UIDs the panel holds are then meaningless.
const isStale = err => /renumbered|uidvalidity\s+\d+\s*->\s*\d+/i.test(String(err && err.message));

let lastHeight = 0;
function reportSize() {
  const h = Math.ceil(document.documentElement.scrollHeight);
  if (h !== lastHeight) { lastHeight = h; notify("ui/notifications/size-changed", {height: h}); }
}
// Hosts size the iframe from these reports. The observer covers layout
// changes; renders also report directly, because observers can be paused
// while the host keeps the panel in the background.
new ResizeObserver(reportSize).observe(document.body);

function applyHostContext(ctx) {
  if (!ctx) return;
  if (ctx.theme === "light" || ctx.theme === "dark") document.documentElement.dataset.theme = ctx.theme;
  if (Array.isArray(ctx.availableDisplayModes)) S.displayModes = ctx.availableDisplayModes;
  if (ctx.displayMode) S.displayMode = ctx.displayMode;
  if (ctx.locale && ctx.locale !== S.hostLocale) {
    S.hostLocale = ctx.locale;
    S.lang = pickLang(ctx.locale);
    applyStaticTexts();
    renderAll();
  }
  applyDisplayMode();
}

window.addEventListener("message", e => {
  if (e.source !== window.parent || !e.data) return;
  const {method, params} = e.data;
  if (method === "ui/notifications/host-context-changed") applyHostContext(params);
  else if (method === "ui/notifications/tool-result") onOpeningResult((params && (params.structuredContent || params.structured_content)) || null);
});

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
function onOpeningResult(data) {
  if (!data || !Array.isArray(data.accounts)) return;
  S.started = true;
  S.accounts = data.accounts;
  renderDisplayButton();
  if (!S.accounts.length) {
    $("empty").hidden = false;
    $("main").hidden = true;
    $("account-wrap").hidden = true;
    setStatus("");
    renderReadRule();
    reportSize();
    return;
  }
  $("empty").hidden = true;
  $("main").hidden = false;
  const chosen = S.accounts.some(a => a.id === data.account) ? data.account : S.accounts[0].id;
  renderAccounts(chosen);
  const ready = selectAccount(chosen, data.folder || "INBOX");
  schedulePoll(POLL_MS);
  // The AI can open the panel on one message, typically a draft it has just
  // saved; a draft then opens straight in the compose view.
  const target = data.open && Number(data.open.uid) > 0 ? data.open : null;
  if (target) {
    const folder = S.folder;
    ready.then(() => {
      if (S.account === chosen && S.folder === folder) {
        openMessage(Number(target.uid), {uidvalidity: Number(target.uidvalidity) || 0, direct: true, editDraft: true});
      }
    });
  }
}

function renderAccounts(chosen) {
  const select = $("account");
  select.textContent = "";
  for (const a of S.accounts) {
    select.append(el("option", {value: a.id, text: a.email && a.email !== a.display_name ? `${a.display_name} (${a.email})` : a.display_name}));
  }
  select.value = chosen;
  $("account-wrap").hidden = S.accounts.length < 2;
}

function selectAccount(id, folder) {
  S.account = id;
  S.folder = folder || "INBOX";
  const acc = currentAccount();
  S.organise = !!(acc && acc.organise);
  S.readMarking = (acc && acc.read_marking) || "never";
  $("account-name").textContent = acc && S.accounts.length < 2 ? (acc.email && acc.email !== acc.display_name ? `${acc.display_name} (${acc.email})` : acc.display_name) : "";
  S.selected.clear();
  S.query.text = "";
  $("q").value = "";
  if (S.compose) closeCompose();
  closeMessage();
  renderReadRule();
  renderPermissions();
  S.folders = [];
  renderFolders();
  const folders = loadFolders();
  loadList({reset: true});
  return folders;
}

async function loadFolders() {
  const account = S.account;
  try {
    const data = await callTool("imap_panel_folders", {account});
    if (account !== S.account) return;
    S.folders = Array.isArray(data.folders) ? data.folders : [];
    renderFolders();
  } catch (err) {
    if (account === S.account) setStatus(t("mailbox.error_folders", {detail: err.message}), true);
  }
}

async function loadList({reset = false, append = false, staleRetry = false, notice = ""} = {}) {
  const seq = ++S.listSeq;
  const account = S.account, folder = S.folder;
  const offset = append && S.list.next_offset != null ? S.list.next_offset : 0;
  if (!append) { setStatus(t("mailbox.loading_list")); P.last = Date.now(); }
  $("more").disabled = true;
  try {
    const data = await callTool("imap_panel_list", {
      account, folder,
      text: S.query.text,
      unseen: S.query.unseen ? true : null,
      flagged: S.query.flagged ? true : null,
      offset, limit: 50,
    });
    if (seq !== S.listSeq) return;
    if (data.permissions) updateAccountFromServer(data.permissions);
    const incoming = Array.isArray(data.messages) ? data.messages : [];
    const firstNewUid = incoming.length ? incoming[0].uid : null;
    if (append) {
      const known = new Set(S.list.messages.map(m => m.uid));
      S.list.messages = S.list.messages.concat(incoming.filter(m => !known.has(m.uid)));
    } else {
      S.list.messages = incoming;
      if (reset) S.activeUid = null;
      // Ticks for messages that are no longer listed would act on nothing visible.
      const listed = new Set(incoming.map(m => m.uid));
      for (const uid of [...S.selected]) if (!listed.has(uid)) S.selected.delete(uid);
    }
    S.list.total = data.total || 0;
    S.list.next_offset = data.next_offset != null ? data.next_offset : null;
    S.list.uidvalidity = data.uidvalidity || 0;
    S.list.search_note = data.search_note || null;
    if (!append) S.list.highUid = incoming.length ? incoming[0].uid : 0;
    else if (incoming.length) S.list.highUid = Math.max(S.list.highUid, incoming[0].uid);
    if (!append) { P.updated = new Date(); P.failed = false; }
    renderList();
    renderUpdated();
    if (append) {
      setStatus(tn("mailbox.loaded_more", incoming.length));
      if (firstNewUid != null) focusRow(firstNewUid, "open");
    } else {
      setStatus(notice || listSummary());
    }
  } catch (err) {
    if (seq !== S.listSeq) return;
    if (isStale(err) && !staleRetry) {
      return loadList({reset: true, staleRetry: true, notice: t("mailbox.stale_reloaded")});
    }
    $("more").disabled = false;
    setStatus(t("mailbox.error_list", {detail: err.message}), true);
  }
}

function updateAccountFromServer(summary) {
  const acc = currentAccount();
  const before = acc ? [!!acc.save_attachments, !!acc.has_knowledge_base, acc.send_mode] : [false, false, undefined];
  if (acc) Object.assign(acc, summary);
  const organise = !!summary.organise;
  const reading = summary.read_marking || "never";
  const changed = organise !== S.organise || reading !== S.readMarking
    || before[0] !== !!summary.save_attachments || before[1] !== !!summary.has_knowledge_base
    || before[2] !== summary.send_mode;
  S.organise = organise;
  S.readMarking = reading;
  if (!S.organise) S.selected.clear();
  if (changed) { renderPermissions(); renderReadRule(); renderMessage(); }
}

function listSummary() {
  const n = S.list.messages.length;
  if (!n) return filtersActive() ? t("mailbox.list_no_match") : t("mailbox.list_empty");
  return tn("mailbox.list_count", S.list.total, {shown: n, total: S.list.total, folder: folderLabel(S.folder)});
}

const filtersActive = () => !!(S.query.text || S.query.unseen || S.query.flagged);

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderAll() {
  if (!S.started) return;
  renderReadRule();
  renderPermissions();
  renderFolders();
  renderList();
  renderMessage();
  if (S.compose) renderComposeTexts();
  renderDisplayButton();
  renderUpdated();
}

function renderReadRule() {
  $("read-rule").textContent = S.accounts.length
    ? t(S.readMarking === "user_open" ? "mailbox.read_rule.user_open" : "mailbox.read_rule.never")
    : "";
}

function renderPermissions() {
  $("organise-off").hidden = S.organise;
  $("new-message").hidden = !composeAllowed();
  renderBulk();
}

function renderFolders() {
  const list = $("folder-list");
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.folder : null;
  list.textContent = "";
  const names = new Set(S.folders.map(f => f.name));
  for (const f of sortedFolders()) {
    const parts = f.delimiter ? String(f.name).split(f.delimiter).filter(Boolean) : [String(f.name)];
    // Nested folders show their last part, indented, when the parent is
    // listed too; otherwise the whole path.
    const parent = parts.length > 1 ? parts.slice(0, -1).join(f.delimiter) : null;
    const nested = !folderKind(f) && parent && names.has(parent);
    const label = nested ? parts[parts.length - 1] : folderLabel(f.name);
    const depth = nested ? parts.length - 1 : 0;
    const li = el("li", {});
    li.style.paddingLeft = `${depth * 1}rem`;
    if (f.selectable === false) {
      li.append(el("span", {class: "noselect", text: label}));
    } else {
      const button = el("button", {type: "button", "data-folder": f.name, "aria-current": f.name === S.folder ? "true" : null,
                                   tabindex: f.name === S.folder ? "0" : "-1"},
        el("span", {class: "folder-name", text: label}));
      if (nested) button.append(el("span", {class: "sr-only", text: `, ${folderLabel(f.name)}`}));
      if (f.unseen) button.append(folderCount(f));
      li.append(button);
    }
    list.append(li);
  }
  if (focused) {
    const again = list.querySelector(`button[data-folder="${CSS.escape(focused)}"]`);
    if (again) again.focus();
  }
  // One tab stop for the folder list: the current folder, or the first.
  if (!list.querySelector('button[tabindex="0"]')) {
    const first = list.querySelector("button[data-folder]");
    if (first) first.setAttribute("tabindex", "0");
  }
  renderFolderSummary();
  renderDestinations();
  syncFolderDisclosure();
}

function folderCount(f) {
  return el("span", {class: "folder-count"},
    String(f.unseen), el("span", {class: "sr-only", text: ` ${tn("mailbox.folder_unseen_label", f.unseen)}`}));
}

function renderFolderSummary() {
  const current = folderInfo(S.folder);
  const unseen = current.unseen ? ` (${tn("mailbox.folder_unseen", current.unseen)})` : "";
  $("folders-summary").textContent = t("mailbox.folder_summary", {folder: folderLabel(S.folder)}) + unseen;
  $("list-heading").textContent = folderLabel(S.folder);
}

function destinationFolders() {
  return sortedFolders().filter(f => f.selectable !== false && f.name !== S.folder);
}

function renderDestinations() {
  for (const id of ["act-dest", "bulk-dest"]) {
    const select = $(id);
    const keep = select.value;
    select.textContent = "";
    select.append(el("option", {value: "", text: t("mailbox.move_choose")}));
    for (const f of destinationFolders()) select.append(el("option", {value: f.name, text: folderLabel(f.name)}));
    if ([...select.options].some(o => o.value === keep)) select.value = keep;
  }
}

function renderList() {
  const ul = $("message-list");
  const active = document.activeElement;
  const refocus = active && ul.contains(active) ? {uid: Number(active.closest("li").dataset.uid), kind: active.dataset.kind} : null;
  ul.textContent = "";
  const messages = S.list.messages;
  if (S.activeUid == null || !messages.some(m => m.uid === S.activeUid)) {
    S.activeUid = S.open && messages.some(m => m.uid === S.open.uid) ? S.open.uid : (messages[0] ? messages[0].uid : null);
  }
  for (const m of messages) ul.append(renderRow(m));
  if (refocus) focusRow(refocus.uid, refocus.kind) || focusRow(S.activeUid, "open");
  renderListMeta();
}

// Everything around the rows: empty text, count, "show more", bulk bar.
function renderListMeta() {
  const messages = S.list.messages;
  $("list-empty").hidden = messages.length > 0;
  $("list-empty").textContent = messages.length ? "" : (filtersActive() ? t("mailbox.list_no_match") : t("mailbox.list_empty"));
  $("list-count").textContent = messages.length ? tn("mailbox.list_count", S.list.total, {shown: messages.length, total: S.list.total}) : "";
  $("more").hidden = S.list.next_offset == null;
  $("more").disabled = false;
  $("search-note").hidden = !S.list.search_note;
  renderBulk();
  reportSize();
}

function renderRow(m) {
  const tabbable = m.uid === S.activeUid ? "0" : "-1";
  const li = el("li", {"data-uid": m.uid, class: m.seen ? "" : "unread"});
  if (S.organise) {
    const box = el("input", {type: "checkbox", id: `sel-${m.uid}`, "data-kind": "check", tabindex: tabbable});
    box.checked = S.selected.has(m.uid);
    const label = el("label", {for: `sel-${m.uid}`, class: "sr-only", text: t("mailbox.select_message", {subject: m.subject || t("mailbox.no_subject")})});
    li.append(el("span", {class: "row-check"}, box, label));
  }
  const date = m.date_header || m.date;
  const tags = el("span", {class: "row-tags"});
  if (!m.seen) tags.append(el("span", {class: "tag", text: t("mailbox.unread")}));
  if (m.flagged) tags.append(el("span", {class: "tag", text: t("mailbox.flagged")}));
  const sep = () => el("span", {class: "sr-only", text: ", "});
  const button = el("button", {type: "button", class: "row-open", "data-kind": "open", tabindex: tabbable,
                               "aria-current": S.open && S.open.uid === m.uid ? "true" : null},
    el("span", {class: "row-from", text: senderName(m.from)}), sep(),
    el("time", {class: "row-date", datetime: date || null, title: fmtLongDate(date), text: fmtListDate(date)}), sep(),
    el("span", {class: "row-subject", text: m.subject || t("mailbox.no_subject")}),
    tags.childElementCount ? sep() : null,
    tags);
  li.append(button);
  return li;
}

function rowElements() {
  return [...$("message-list").children];
}

function setActiveRow(uid) {
  S.activeUid = uid;
  for (const li of rowElements()) {
    const on = Number(li.dataset.uid) === uid ? "0" : "-1";
    for (const c of li.querySelectorAll("[data-kind]")) c.setAttribute("tabindex", on);
  }
}

function focusRow(uid, kind) {
  const li = rowElements().find(r => Number(r.dataset.uid) === uid);
  if (!li) return false;
  setActiveRow(uid);
  const target = li.querySelector(`[data-kind="${kind || "open"}"]`) || li.querySelector('[data-kind="open"]');
  target.focus();
  return true;
}

function renderBulk() {
  const n = S.selected.size;
  $("bulk").hidden = !S.organise || n === 0;
  $("bulk-count").textContent = tn("mailbox.selected_count", n);
  $("bulk-trash").hidden = folderKind(folderInfo(S.folder)) === "trash";
}

function renderMessage() {
  const m = S.open;
  const composing = !!S.compose;
  $("msg").hidden = !m || composing;
  $("read-placeholder").hidden = !!m || composing;
  $("back").textContent = t(composing && m ? "mailbox.compose_back_message" : "mailbox.back");
  if (!m) return;
  const h = m.headers || {};
  $("msg-subject").textContent = h.subject || t("mailbox.no_subject");
  const dl = $("msg-headers");
  dl.textContent = "";
  const rows = [["mailbox.from", fmtAddresses(h.from)], ["mailbox.to", fmtAddresses(h.to)],
                ["mailbox.cc", fmtAddresses(h.cc)], ["mailbox.date", fmtLongDate(h.date)]];
  for (const [key, value] of rows) {
    if (!value) continue;
    dl.append(el("dt", {text: t(key)}), el("dd", {text: value}));
  }
  const seen = (m.flags || []).includes("\\Seen");
  const flagged = (m.flags || []).includes("\\Flagged");
  for (const id of ["act-read", "act-flag", "act-trash", "act-move-wrap"]) $(id).hidden = !S.organise;
  $("act-read").textContent = t(seen ? "mailbox.mark_unread" : "mailbox.mark_read");
  $("act-flag").textContent = t(flagged ? "mailbox.unflag" : "mailbox.flag");
  if (folderKind(folderInfo(m.folder)) === "trash") $("act-trash").hidden = true;
  const canWrite = composeAllowed();
  const draft = isDraft(m);
  for (const id of ["act-reply", "act-reply-all", "act-forward"]) $(id).hidden = !canWrite || draft;
  $("act-edit-draft").hidden = !canWrite || !draft;
  const format = $("msg-format");
  format.hidden = !(m.body_format === "html" || m.body_format === "none" || !m.body);
  format.textContent = m.body_format === "html" && m.body ? t("mailbox.html_note") : (!m.body ? t("mailbox.no_body") : "");
  const bodyEl = $("msg-body");
  bodyEl.textContent = "";
  const rich = !!(m.body_html && window.DOMPurify && typeof DOMPurify.sanitize === "function");
  bodyEl.classList.toggle("html", rich);
  bodyEl.classList.toggle("sender-layout", rich && !!(m.external && m.external.loaded));
  if (rich) {
    // Sanitised on the server and again here; links open through the host.
    bodyEl.append(readingFragment(m.body_html, !!(m.external && m.external.loaded)));
    format.hidden = true;
  } else {
    bodyEl.textContent = m.body || "";
  }
  bodyEl.hidden = !(m.body || rich);
  renderExternal(rich ? (m.external || {}) : null);
  $("msg-truncated").hidden = !m.body_truncated;
  const atts = m.attachments || [];
  $("msg-attachments").hidden = atts.length === 0;
  const ul = $("att-list");
  ul.textContent = "";
  for (const a of atts) {
    ul.append(el("li", {}, el("span", {text: a.filename || t("mailbox.unnamed_attachment")}),
      el("span", {class: "muted small", text: ` – ${a.content_type || ""}, ${fmtSize(a.size_bytes)}`})));
  }
  const acc = currentAccount();
  const canSave = !!(acc && acc.save_attachments);
  $("att-save-wrap").hidden = !atts.length || !canSave;
  $("att-save-off").hidden = !atts.length || canSave;
  $("act-kb").hidden = !(acc && acc.has_knowledge_base);
  renderSaveResult();
  reportSize();
}

// ---------------------------------------------------------------------------
// Saved attachments
// ---------------------------------------------------------------------------
const messageKey = m => m ? `${S.account}\u0000${m.folder}\u0000${m.uidvalidity}\u0000${m.uid}` : "";

const QUARANTINE = "karantän";

function quarantineReasons(row) {
  let codes = row.quarantine_reasons || [];
  // "Not a usual document type" adds nothing next to a more specific reason.
  if (codes.includes("risky_type") || codes.includes("double_extension")) codes = codes.filter(c => c !== "not_allowlisted");
  const words = codes.map(code => {
    const key = `mailbox.save_reason.${code}`;
    const text = t(key);
    return text === key ? String(code) : text;
  });
  return words.join(", ");
}

// One sentence per file, e.g. "sparad i karantän (filtypen kan vara skadlig)".
function saveOutcome(row) {
  if (row.status === "skipped") {
    const key = {too_large: "too_large", inline: "inline"}[row.reason] || "call_limit";
    return t(`mailbox.save_row.${key}`);
  }
  const quarantined = row.category === QUARANTINE;
  const done = row.status === "already_saved" ? "already" : "saved";
  if (!quarantined) return t(`mailbox.save_row.${done}_documents`);
  const reasons = quarantineReasons(row);
  return reasons ? t(`mailbox.save_row.${done}_quarantine_why`, {reasons}) : t(`mailbox.save_row.${done}_quarantine`);
}

function renderSaveResult() {
  const box = $("att-result");
  const result = S.saveResult && S.saveResult.key === messageKey(S.open) ? S.saveResult.data : null;
  box.hidden = !result;
  if (!result) return;
  const rows = Array.isArray(result.saved) ? result.saved : [];
  const ul = $("att-result-list");
  ul.textContent = "";
  for (const row of rows) {
    const quarantined = row.category === QUARANTINE && row.status !== "skipped";
    const li = el("li", {class: quarantined ? "quarantine" : ""},
      el("span", {class: "save-name", text: row.filename || t("mailbox.unnamed_attachment")}),
      quarantined ? el("span", {class: "tag tag-quarantine", text: t("mailbox.save_quarantine_tag")}) : null,
      el("span", {text: ` – ${saveOutcome(row)}`}));
    if (row.path && row.status !== "skipped") li.append(el("span", {class: "save-path", text: row.path}));
    ul.append(li);
  }
  // The server reports skipped inline parts itself; this covers any it did not list.
  const handled = new Set(rows.map(r => r.part_id));
  for (const a of (S.open && S.open.attachments) || []) {
    if (!a.inline || handled.has(a.part_id)) continue;
    ul.append(el("li", {},
      el("span", {class: "save-name", text: a.filename || t("mailbox.unnamed_attachment")}),
      el("span", {text: ` – ${t("mailbox.save_row.inline")}`})));
  }
  $("att-quarantine-note").hidden = !rows.some(r => r.category === QUARANTINE && r.status !== "skipped");
  $("att-folder").textContent = result.attachments_folder || "";
}

function saveSummary(result) {
  const rows = Array.isArray(result.saved) ? result.saved : [];
  const count = test => rows.filter(test).length;
  const parts = [
    ["documents", count(r => r.status === "saved" && r.category !== QUARANTINE)],
    ["quarantine", count(r => r.status === "saved" && r.category === QUARANTINE)],
    ["already", count(r => r.status === "already_saved")],
    ["skipped", count(r => r.status === "skipped")],
  ].filter(([, n]) => n > 0).map(([kind, n]) => tn(`mailbox.save_status.${kind}`, n));
  if (!parts.length) return t("mailbox.save_none");
  return t("mailbox.save_done", {summary: parts.join(", "), folder: result.attachments_folder || ""});
}

async function saveAttachments() {
  const m = S.open;
  if (!m || S.saving) return;
  S.saving = true;
  const button = $("att-save");
  // aria-disabled rather than disabled, so that focus stays on the button.
  button.setAttribute("aria-disabled", "true");
  setStatus(t("mailbox.saving"));
  try {
    const data = await callTool("imap_panel_save_attachments", {account: S.account, folder: m.folder, uid: m.uid, uidvalidity: m.uidvalidity});
    S.saveResult = {key: messageKey(m), data};
    if (S.open === m) { renderSaveResult(); reportSize(); }
    setStatus(saveSummary(data));
  } catch (err) {
    if (isStale(err)) {
      // The UIDs are renumbered: the open message may now be another one.
      closeMessage();
      $("list-heading").focus();
      loadList({reset: true, staleRetry: true, notice: t("mailbox.stale_retry")});
      return;
    }
    setStatus(t("mailbox.error_save", {detail: err.message}), true);
  } finally {
    S.saving = false;
    button.removeAttribute("aria-disabled");
  }
}

// ---------------------------------------------------------------------------
// Display mode
// ---------------------------------------------------------------------------
// Some clients show the MCP Apps "fullscreen" mode as their side panel and
// give it their own control for a larger window. Such a client may grant
// the mode only right after a click or key press inside the panel, so the
// one request at start can be refused (silently). While the panel is inline,
// a button at the top offers the side panel, and the first click or key
// press anywhere asks once more, from within that event so that it counts as
// the user's own action. The event is not stopped: the click still opens the
// message it was meant for, and the side panel shows the same state. In the
// side panel a quiet link goes back to the conversation; after the user has
// chosen it, the panel no longer switches by itself.
const sideAvailable = () => S.displayModes.includes("fullscreen");
const gestureArmed = () => sideAvailable() && S.displayMode === "inline" && !S.gestureTried && !S.stayInline;

function renderDisplayButton() {
  const side = S.displayMode === "fullscreen";
  $("side-offer").hidden = !sideAvailable() || side;
  $("side-hint").hidden = !gestureArmed();
  $("display-mode").hidden = !sideAvailable() || !side;
}

async function requestDisplayMode(mode) {
  try {
    const result = await request("ui/request-display-mode", {mode});
    if (result && result.mode) S.displayMode = result.mode;
  } catch (e) { /* the host declined; stay as we are */ }
  applyDisplayMode();
}

function applyDisplayMode() {
  const before = document.activeElement;
  document.documentElement.dataset.mode = S.displayMode === "fullscreen" ? "fullscreen" : "inline";
  renderDisplayButton();
  // The control that was pressed is hidden in the new mode: focus moves to
  // the one that takes its place, so it is not lost.
  if (before && before.matches && before.matches("[data-display-control]") && before.offsetParent === null) {
    const other = S.displayMode === "fullscreen" ? $("display-mode") : $("side-open");
    if (other.offsetParent !== null) other.focus();
  }
  reportSize();
}

function autoDisplayMode() {
  if (S.autoDisplayTried) return;
  S.autoDisplayTried = true;
  if (sideAvailable() && S.displayMode === "inline") requestDisplayMode("fullscreen");
}

// Keys that are not a deliberate action in the panel.
const QUIET_KEYS = new Set(["Escape", "Shift", "Control", "Alt", "Meta", "AltGraph", "CapsLock", "Fn"]);

// A click rather than pointerdown: if the host moved the panel between
// pointerdown and pointerup, the click would land elsewhere and be lost.
// The click itself still counts as a recent user action for the host.
function onFirstGesture(e) {
  if (!e.isTrusted || !gestureArmed()) return;
  if (e.type === "keydown" && QUIET_KEYS.has(e.key)) return;
  // The display controls make their own request.
  if (e.target instanceof Element && e.target.closest("[data-display-control]")) return;
  S.gestureTried = true;
  requestDisplayMode("fullscreen");
}
document.addEventListener("click", onFirstGesture, true);
document.addEventListener("keydown", onFirstGesture, true);

// ---------------------------------------------------------------------------
// Keeping the list up to date
// ---------------------------------------------------------------------------
// The panel fetches the first page of the current folder and the folder
// counts again once a minute, while it is visible, and merges them into the
// list without moving focus, scroll position, ticks or the open message.
// Every refresh opens an IMAP connection on the server, so it never runs
// more often than that, stops while the panel is hidden, and waits while
// the user is writing, a dialog is open or another call is under way. Only
// the development harness can shorten the interval, through a global it
// injects into the page; there is no user setting.
const POLL_MS = (() => {
  const seconds = Number(window.__PANEL_HARNESS_POLL_SECONDS__);
  return Number.isFinite(seconds) && seconds >= 5 ? seconds * 1000 : 60000;
})();
const P = {timer: 0, last: 0, updated: null, failed: false};

const refreshBlocked = () => !S.started || !S.account || $("main").hidden || S.inFlight > 0
  || !!S.compose || $("confirm").open;

function schedulePoll(delay) {
  clearTimeout(P.timer);
  P.timer = 0;
  if (document.visibilityState !== "visible" || !S.started || !S.accounts.length) return;
  P.timer = setTimeout(pollTick, Math.max(0, delay));
}

function pollTick() {
  P.timer = 0;
  const wait = POLL_MS - (Date.now() - P.last);
  if (wait > 0) { schedulePoll(wait); return; }
  // Checking again is free; only a refresh contacts the server.
  if (refreshBlocked()) { schedulePoll(3000); return; }
  refreshList();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") schedulePoll(POLL_MS - (Date.now() - P.last));
  else { clearTimeout(P.timer); P.timer = 0; }
});

function fmtTime(date) {
  try {
    return new Intl.DateTimeFormat(intlLocale(), {hour: "2-digit", minute: "2-digit"}).format(date);
  } catch (e) {
    return date.toTimeString().slice(0, 5);
  }
}

// Shown next to the list heading; not a live region, so it is never read
// out by itself.
function renderUpdated() {
  const box = $("list-updated");
  if (P.failed) box.textContent = t("mailbox.refresh_failed");
  else box.textContent = P.updated ? t("mailbox.updated_at", {time: fmtTime(P.updated)}) : "";
}

// "En ny e-post", "Två nya e-postmeddelanden", "13 nya e-postmeddelanden".
function newMailText(n) {
  const word = n >= 2 && n <= 12 ? t(`mailbox.number.${n}`) : String(n);
  const count = word.charAt(0).toLocaleUpperCase(S.lang) + word.slice(1);
  return tn("mailbox.new_mail", n, {count});
}

async function refreshList() {
  const account = S.account, folder = S.folder, seq = S.listSeq;
  const calls = S.callCount;
  P.last = Date.now();
  const sameView = () => seq === S.listSeq && account === S.account && folder === S.folder;
  let data;
  try {
    data = await callTool("imap_panel_list", {
      account, folder,
      text: S.query.text,
      unseen: S.query.unseen ? true : null,
      flagged: S.query.flagged ? true : null,
      offset: 0, limit: 50,
    });
  } catch (err) {
    if (sameView()) {
      if (isStale(err)) loadList({reset: true, staleRetry: true, notice: t("mailbox.stale_reloaded")});
      else { P.failed = true; renderUpdated(); }
    }
    schedulePoll(POLL_MS);
    return;
  }
  // Something else ran meanwhile (an action, a reload, an opened message):
  // this snapshot may be older than what is shown. Drop it and try again soon.
  if (!sameView() || S.callCount !== calls + 1) {
    P.last = Date.now() - POLL_MS + 5000;
    schedulePoll(5000);
    return;
  }
  if (data.uidvalidity && S.list.uidvalidity && data.uidvalidity !== S.list.uidvalidity) {
    // The folder was renumbered: the UIDs held here name other messages now.
    loadList({reset: true, staleRetry: true, notice: t("mailbox.stale_reloaded")});
    schedulePoll(POLL_MS);
    return;
  }
  if (data.permissions) updateAccountFromServer(data.permissions);
  const fresh = mergeFirstPage(data);
  patchList();
  P.updated = new Date();
  P.failed = false;
  renderUpdated();
  if (fresh > 0) setStatus(newMailText(fresh));
  // The folder counts, in place. A failure here is left for the next round.
  const before = S.callCount;
  try {
    const f = await callTool("imap_panel_folders", {account});
    if (account === S.account && S.callCount === before + 1 && Array.isArray(f.folders)) patchFolders(f.folders);
  } catch (err) { /* the list is up to date; counts follow next time */ }
  schedulePoll(POLL_MS - (Date.now() - P.last));
}

// Merges a fresh first page into the list. UIDs only grow, and the list is
// newest first, so rows above the oldest one on the fresh page are replaced
// by that page (new ones come in at the top, gone ones leave, flags are
// updated), and pages loaded with "show more" below it are kept. Returns
// the number of messages that are new since the list was loaded.
function mergeFirstPage(data) {
  const incoming = Array.isArray(data.messages) ? data.messages : [];
  let merged;
  if (data.next_offset == null) {
    merged = incoming.slice();
  } else {
    const oldest = incoming.length ? incoming[incoming.length - 1].uid : Infinity;
    merged = incoming.concat(S.list.messages.filter(m => m.uid < oldest));
  }
  const fresh = incoming.filter(m => m.uid > S.list.highUid).length;
  S.list.messages = merged;
  S.list.total = data.total || 0;
  S.list.next_offset = S.list.total > merged.length ? merged.length : null;
  S.list.uidvalidity = data.uidvalidity || S.list.uidvalidity;
  S.list.search_note = data.search_note || null;
  if (incoming.length) S.list.highUid = Math.max(S.list.highUid, incoming[0].uid);
  const listed = new Set(merged.map(m => m.uid));
  for (const uid of [...S.selected]) if (!listed.has(uid)) S.selected.delete(uid);
  return fresh;
}

// Brings the rows in line with S.list.messages without rebuilding the
// ones that stay, so the focused row keeps its element (and focus), and
// keeps the rows the user is looking at in place when new ones come in
// above them.
function patchList() {
  const ul = $("message-list");
  const scroller = $("list-scroll");
  const messages = S.list.messages;
  const wanted = new Set(messages.map(m => m.uid));
  const active = document.activeElement;
  const focusedLi = active && ul.contains(active) ? active.closest("li[data-uid]") : null;
  const focusedKind = focusedLi ? active.dataset.kind : null;
  // The first row in view, as a reference point for the scroll position.
  let anchor = null, anchorTop = 0;
  if (scroller.scrollTop > 0) {
    const top = scroller.getBoundingClientRect().top;
    anchor = [...ul.children].find(li => wanted.has(Number(li.dataset.uid)) && li.getBoundingClientRect().bottom > top) || null;
    if (anchor) anchorTop = anchor.getBoundingClientRect().top;
  }
  // A focused row that has gone hands the position to the next older one.
  let refocus = null;
  if (focusedLi && !wanted.has(Number(focusedLi.dataset.uid))) {
    const gone = Number(focusedLi.dataset.uid);
    const next = messages.find(m => m.uid < gone) || messages[messages.length - 1];
    refocus = next ? next.uid : null;
    S.activeUid = refocus;
  }
  if (S.activeUid == null || !wanted.has(S.activeUid)) {
    S.activeUid = S.open && wanted.has(S.open.uid) ? S.open.uid : (messages[0] ? messages[0].uid : null);
  }
  const rows = new Map([...ul.children].map(li => [Number(li.dataset.uid), li]));
  for (const [uid, li] of rows) if (!wanted.has(uid)) li.remove();
  let ref = ul.firstElementChild;
  for (const m of messages) {
    const li = rows.get(m.uid);
    if (li && wanted.has(m.uid)) {
      updateRow(li, m);
      if (li === ref) { ref = ref.nextElementSibling; continue; }
      ul.insertBefore(li, ref);
    } else {
      ul.insertBefore(renderRow(m), ref);
    }
  }
  setActiveRow(S.activeUid);
  if (anchor && anchor.isConnected) scroller.scrollTop += anchor.getBoundingClientRect().top - anchorTop;
  if (focusedLi && !focusedLi.isConnected) {
    if (refocus == null || !focusRow(refocus, focusedKind)) $("list-heading").focus();
  }
  renderListMeta();
}

// Updates a row in place: same elements, new texts and states.
function updateRow(li, m) {
  const fresh = renderRow(m);
  li.className = fresh.className;
  const button = li.querySelector('[data-kind="open"]');
  const newButton = fresh.querySelector('[data-kind="open"]');
  if (button.innerHTML !== newButton.innerHTML) button.replaceChildren(...newButton.childNodes);
  if (newButton.hasAttribute("aria-current")) button.setAttribute("aria-current", "true");
  else button.removeAttribute("aria-current");
  const box = li.querySelector('[data-kind="check"]');
  const newBox = fresh.querySelector('[data-kind="check"]');
  if (!box !== !newBox) {
    // The organise permission changed: the row gains or loses its tick box.
    const check = li.querySelector(".row-check");
    if (check) check.remove();
    if (newBox) li.prepend(fresh.querySelector(".row-check"));
  } else if (box) {
    box.checked = S.selected.has(m.uid);
    const label = li.querySelector(".row-check label");
    const newLabel = fresh.querySelector(".row-check label");
    if (label && newLabel && label.textContent !== newLabel.textContent) label.textContent = newLabel.textContent;
  }
}

// New folder counts, in place. When folders were added or removed the list
// is rebuilt, but not while the user is in it or in a folder menu.
function patchFolders(folders) {
  const key = f => `${f.name}\u0000${f.selectable !== false}\u0000${f.special_use || ""}`;
  const same = folders.length === S.folders.length
    && folders.map(key).sort().join("\u0001") === S.folders.map(key).sort().join("\u0001");
  if (!same) {
    const active = document.activeElement;
    const busy = active && ($("folders-nav").contains(active) || active.id === "act-dest" || active.id === "bulk-dest");
    if (busy) return;
    S.folders = folders;
    renderFolders();
    return;
  }
  S.folders = folders;
  for (const button of $("folder-list").querySelectorAll("button[data-folder]")) {
    const f = folderInfo(button.dataset.folder);
    const old = button.querySelector(".folder-count");
    const fresh = f.unseen ? folderCount(f) : null;
    if (old && fresh) { if (old.textContent !== fresh.textContent) old.replaceWith(fresh); }
    else if (old) old.remove();
    else if (fresh) button.append(fresh);
  }
  renderFolderSummary();
}

// ---------------------------------------------------------------------------
// Layout: narrow widths show one pane at a time
// ---------------------------------------------------------------------------
const narrowQuery = matchMedia("(max-width: 639.98px)");
const wideQuery = matchMedia("(min-width: 900px)");

function setView(view) {
  $("main").dataset.view = view;
  reportSize();
}

function syncFolderDisclosure() {
  // In three columns the folder list is always shown.
  if (wideQuery.matches) $("folders-details").open = true;
}
wideQuery.addEventListener("change", syncFolderDisclosure);
narrowQuery.addEventListener("change", () => { if (!narrowQuery.matches) setView("list"); else if (S.open) setView("message"); });

// ---------------------------------------------------------------------------
// Opening and closing messages
// ---------------------------------------------------------------------------
// opts.direct opens a message that is not (yet) in the loaded list, by the
// uidvalidity given; opts.editDraft goes straight to the compose view when
// the message is a draft; opts.notice is the status shown afterwards.
async function openMessage(uid, opts = {}) {
  const row = S.list.messages.find(m => m.uid === uid);
  if (!row && !opts.direct) return;
  if (row) setActiveRow(uid);
  const account = S.account, folder = S.folder;
  const uidvalidity = opts.uidvalidity || (row && row.uidvalidity) || S.list.uidvalidity;
  setStatus(t("mailbox.opening"));
  try {
    const data = await callTool("imap_panel_open", {account, folder, uid, uidvalidity});
    if (account !== S.account || folder !== S.folder) return;
    S.open = data;
    if (row && data.flags) {
      row.flags = data.flags;
      row.seen = data.flags.includes("\\Seen");
      row.flagged = data.flags.includes("\\Flagged");
    }
    renderList();
    renderMessage();
    if (narrowQuery.matches) setView("message");
    $("read-pane").scrollTop = 0;
    if (opts.editDraft && isDraft(data) && composeAllowed()) {
      startCompose("edit_draft");
      return;
    }
    $("msg-subject").focus();
    if (data.marked_read) {
      setStatus(opts.notice ? `${opts.notice} ${t("mailbox.marked_read_on_open")}` : t("mailbox.marked_read_on_open"));
      loadFolders();
    } else {
      setStatus(opts.notice || "");
    }
  } catch (err) {
    if (isStale(err)) {
      loadList({reset: true, staleRetry: true, notice: t("mailbox.stale_retry")});
      return;
    }
    setStatus(t("mailbox.error_open", {detail: err.message}), true);
  }
}

function closeMessage() {
  S.open = null;
  setView("list");
  renderMessage();
}

function backToList() {
  const uid = S.open ? S.open.uid : S.activeUid;
  setView("list");
  if (!focusRow(uid, "open")) $("list-heading").focus();
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
const confirmDialog = (() => {
  const dialog = $("confirm");
  let settle = null;
  $("confirm-ok").addEventListener("click", () => dialog.close("ok"));
  $("confirm-cancel").addEventListener("click", () => dialog.close("cancel"));
  dialog.addEventListener("close", () => { if (settle) { settle(dialog.returnValue === "ok"); settle = null; } });
  return (title, text, okLabel, cancelLabel) => new Promise(resolve => {
    $("confirm-title").textContent = title;
    $("confirm-text").textContent = text;
    $("confirm-ok").textContent = okLabel;
    $("confirm-cancel").textContent = cancelLabel || t("mailbox.cancel");
    dialog.returnValue = "";
    settle = resolve;
    dialog.showModal();
    // The safe choice has focus first.
    $("confirm-cancel").focus();
  });
})();

async function runAction(action, uids, opts = {}) {
  if (!S.organise || !uids.length) return;
  const destination = opts.destination || "";
  if (action === "move" && !destination) {
    setStatus(t("mailbox.move_choose_first"), true);
    if (opts.select) opts.select.focus();
    return;
  }
  const opener = document.activeElement;
  if (action === "trash") {
    const ok = await confirmDialog(tn("mailbox.confirm_trash_title", uids.length), t("mailbox.confirm_trash_text"), t("mailbox.trash"));
    if (!ok) { if (opener && opener.isConnected) opener.focus(); return; }
  }
  // Remember where the list focus should land if messages leave the folder.
  const order = S.list.messages.map(m => m.uid);
  const firstIndex = Math.min(...uids.map(u => order.indexOf(u)).filter(i => i >= 0));
  try {
    const data = await callTool("imap_panel_action", {
      account: S.account, folder: S.folder, uids, uidvalidity: S.list.uidvalidity, action, destination,
    });
    if (action === "trash" || action === "move") {
      const gone = new Set(uids.filter(u => !(data.not_found || []).includes(u)));
      S.list.messages = S.list.messages.filter(m => !gone.has(m.uid));
      S.list.total = Math.max(0, S.list.total - gone.size);
      for (const u of gone) S.selected.delete(u);
      const openGone = S.open && gone.has(S.open.uid);
      if (openGone) closeMessage();
      const next = S.list.messages[Math.min(firstIndex, S.list.messages.length - 1)];
      S.activeUid = next ? next.uid : null;
      renderList();
      // The button that was pressed may have gone with the message or the
      // selection; then focus moves on to the next message in the list.
      const openerVisible = opener && opener.isConnected && opener.offsetParent !== null && opener !== document.body;
      if (next && (openGone || !openerVisible)) focusRow(next.uid, "open");
      else if (!next) $("list-heading").focus();
      else opener.focus();
      const count = data.count != null ? data.count : gone.size;
      setStatus(action === "trash" ? tn("mailbox.done.trash", count) : tn("mailbox.done.move", count, {folder: folderLabel(destination)}));
    } else {
      for (const u of data.updated || []) {
        const row = S.list.messages.find(m => m.uid === u.uid);
        if (row) { row.flags = u.flags; row.seen = u.flags.includes("\\Seen"); row.flagged = u.flags.includes("\\Flagged"); }
        if (S.open && S.open.uid === u.uid) S.open.flags = u.flags;
      }
      renderList();
      renderMessage();
      if (opener && opener.isConnected) opener.focus();
      setStatus(tn(`mailbox.done.${action}`, uids.length));
    }
    loadFolders();
  } catch (err) {
    if (isStale(err)) {
      // Never repeat a change with new UIDs: they may name other messages.
      S.selected.clear();
      loadList({reset: true, staleRetry: true, notice: t("mailbox.stale_retry")});
      return;
    }
    setStatus(t("mailbox.error_action", {detail: err.message}), true);
  }
}

// A reference to the open message for a chat message: never the body.
function messageReference(m) {
  const acc = currentAccount();
  // The subject is written by the sender; keep it to one short line so it
  // cannot pose as more of the user's message than a quoted title.
  let subject = String((m.headers && m.headers.subject) || t("mailbox.no_subject")).replace(/[\s\u2028\u2029]+/g, " ").trim();
  if (subject.length > 160) subject = subject.slice(0, 157) + "…";
  return {subject, account: acc ? acc.id : S.account, folder: m.folder, uid: m.uid, uidvalidity: m.uidvalidity};
}

async function sendToChat(textKey, doneKey, failedKey) {
  const m = S.open;
  if (!m) return;
  const text = t(textKey, messageReference(m));
  try {
    const result = await request("ui/message", {role: "user", content: [{type: "text", text}]});
    if (result && result.isError) throw new Error("rejected");
    setStatus(t(doneKey));
  } catch (e) {
    setStatus(t(failedKey), true);
  }
}

const askAboutMessage = () => sendToChat("mailbox.ask_text", "mailbox.asked", "mailbox.ask_failed");
const suggestReply = () => sendToChat("mailbox.kb_suggest_text", "mailbox.kb_asked", "mailbox.kb_ask_failed");

// ---------------------------------------------------------------------------
// Writing: new messages, replies, forwards and drafts
// ---------------------------------------------------------------------------
// The compose view takes the reading pane's place. For replies and forwards
// the server quotes the original below the user's text when the message is
// saved or sent, so the body field only holds what the user writes.
const COMPOSE_FIELDS = ["to", "cc", "bcc"];

function composeAllowed() {
  const acc = currentAccount();
  return !!(acc && acc.send_mode && acc.send_mode !== "off");
}

const isDraft = m => !!m && (folderKind(folderInfo(m.folder)) === "drafts" || (m.flags || []).includes("\\Draft"));

// Splits "Anna <a@x.se>; \"Berg, Bo\" <b@y.se>" on commas and semicolons
// outside quotes and angle brackets.
function splitRecipients(text) {
  const out = [];
  let cur = "", quoted = false, angle = false;
  for (const ch of String(text || "")) {
    if (ch === '"') quoted = !quoted;
    else if (ch === "<" && !quoted) angle = true;
    else if (ch === ">" && !quoted) angle = false;
    if ((ch === "," || ch === ";") && !quoted && !angle) { out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(v => v.trim()).filter(Boolean);
}

// The same rule as the server: something@domain.tld, optionally with a name.
const ADDRESS = /^[^@\s<>]+@[^@\s<>]+\.[^@\s<>]+$/;
function validRecipient(item) {
  const named = item.match(/^([^<>]*)<([^<>]*)>$/);
  return named ? ADDRESS.test(named[2].trim()) : ADDRESS.test(item);
}

// ---------------------------------------------------------------------------
// Formatting editor (HTML messages)
// ---------------------------------------------------------------------------
// Squire edits a contenteditable element; DOMPurify cleans every piece of
// HTML that goes into it (drafts loaded from the server and pasted text)
// and the read-only quotation of an HTML draft. The allowlist matches what
// the server keeps when it sanitises the message again before saving or
// sending. No images, styles or forms, so nothing in the editor can make
// a request.
const PURIFY_TAGS = ["p", "br", "div", "span", "strong", "b", "em", "i", "u", "s", "h1", "h2", "h3", "h4",
  "ul", "ol", "li", "a", "blockquote", "pre", "code", "hr", "table", "thead", "tbody", "tfoot", "tr", "th",
  "td", "caption", "sub", "sup"];
const PURIFY_EDITOR = {ALLOWED_TAGS: PURIFY_TAGS, ALLOWED_ATTR: ["href", "colspan", "rowspan"],
                       ALLOW_DATA_ATTR: false, ALLOW_ARIA_ATTR: false,
                       ALLOWED_URI_REGEXP: /^(?:https?:|mailto:)/i};
// The quotation is only shown: its links stay text, so nothing in it can
// be followed from inside the panel by mistake.
const PURIFY_QUOTE = {ALLOWED_TAGS: PURIFY_TAGS, ALLOWED_ATTR: ["colspan", "rowspan"],
                      ALLOW_DATA_ATTR: false, ALLOW_ARIA_ATTR: false};
const SAFE_LINK = /^(?:https?:\/\/[^\s<>"]+|mailto:[^\s<>"]+)$/i;
// Reading a formatted message: links are kept (opened through the host),
// everything else as in the editor's allowlist.
const PURIFY_READ = {ALLOWED_TAGS: PURIFY_TAGS, ALLOWED_ATTR: ["href", "colspan", "rowspan"],
                     ALLOW_DATA_ATTR: false, ALLOW_ARIA_ATTR: false,
                     ALLOWED_URI_REGEXP: /^(?:https?:|mailto:)/i};

// Images that are parts of the message (inline, cid:) are always shown;
// with external content allowed the message also keeps its remote images
// and simple layout. The server has already replaced every image address
// with inline data and filtered the styles; this check makes sure nothing
// that could reach the network is left (an image with another source, or
// a style that names a url()).
const PURIFY_READ_IMAGES = {...PURIFY_READ, ALLOWED_TAGS: [...PURIFY_TAGS, "img"],
                            ALLOWED_ATTR: [...PURIFY_READ.ALLOWED_ATTR, "src", "alt", "width", "height"]};
const PURIFY_READ_EXT = {...PURIFY_READ, ALLOWED_TAGS: [...PURIFY_TAGS, "img", "center", "font"],
                         ALLOWED_ATTR: [...PURIFY_READ.ALLOWED_ATTR, "src", "alt", "width", "height", "style",
                                        "align", "valign", "bgcolor"]};
const DATA_IMAGE = /^data:image\/(?:png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/;

function readingFragment(html, external) {
  const frag = sanitizedFragment(html, external ? PURIFY_READ_EXT : PURIFY_READ_IMAGES);
  for (const img of frag.querySelectorAll("img")) if (!DATA_IMAGE.test(img.getAttribute("src") || "")) img.remove();
  for (const node of frag.querySelectorAll("[style]")) {
    if (/url\s*\(|expression|@import|position/i.test(node.getAttribute("style"))) node.removeAttribute("style");
  }
  return frag;
}

function renderExternal(ext) {
  const box = $("msg-external");
